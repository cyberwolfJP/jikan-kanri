<style>
:root{
  --ai:#b3192b; --ai-d:#7c0f1c; --gold:#f0b43c; --gold-l:#fdecc8; --ink:#232a35; --sub:#6d7380;
  --bg:#faf5f2; --card:#fff; --line:#e4ded4;
  --ok:#2e8b57; --mid:#d4901c; --ng:#c0392b; --none:#d6d1c9;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans SC","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;padding-bottom:calc(76px + var(--safe-b))}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
header{background:var(--ai);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:16px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#langSel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 6px;font-size:13px;max-width:96px}
#langSel option{color:#000}
#gearBtn{width:34px;height:34px;padding:0;display:grid;place-items:center}
main{max-width:760px;margin:0 auto;padding:14px 12px 24px}
nav#bottomNav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
nav#bottomNav button{flex:1;background:none;border:none;padding:8px 2px 7px;color:#8a8f99;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav#bottomNav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#bottomNav button.on{color:var(--ai);font-weight:bold}
nav#bottomNav button.on svg{stroke:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--ai);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .muted{font-weight:normal}
.muted{color:var(--sub);font-size:13px}
.center{text-align:center}
.hidden{display:none!important}
.btn{border:none;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:bold;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.main{background:var(--ai);color:#fff}
.btn.gold{background:var(--gold);color:var(--ai-d)}
.btn.line{background:#fff;color:var(--ai);border:1.5px solid var(--line)}
.btn.line.sel{border-color:var(--ai);background:#fbeceb}
.btn.danger{background:#fff;color:var(--ng);border:1.5px solid #e9b8b2}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:14px 18px;font-size:16px}
.btn.block{display:flex;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row.end{justify-content:flex-end;margin-top:16px}
.row.stack{flex-direction:column}
.row.stack .btn{width:100%}
input[type=text],input[type=email],input[type=date],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px;background:#fff}
textarea{min-height:68px;resize:vertical;line-height:1.55;font-size:15px}
label.f{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px;color:#3c4350}
.req{background:var(--ng);color:#fff;font-size:10px;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.err{color:var(--ng);font-size:13px;min-height:18px;margin-top:6px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#eceae5;color:#555;font-weight:bold}
.chip.ok{background:#e1f2e8;color:var(--ok)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ai)}
.bar{height:8px;background:#ece8e1;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.thin{height:5px}
.big{font-size:30px;font-weight:bold;line-height:1.1}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(10px);background:var(--ai-d);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ホーム */
.banner{display:flex;align-items:center;gap:10px;background:var(--gold-l);border:1px solid #ecd39d;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner div{flex:1}
.hero{background:linear-gradient(135deg,var(--ai),#d4343f);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero .muted2{font-size:12px;opacity:.75}
.hello{font-size:18px;font-weight:bold;margin:4px 0 12px}
.word{background:rgba(255,255,255,.1);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.55}
.word span{display:block;font-size:11px;color:var(--gold);margin-bottom:3px;letter-spacing:.05em}
.focus{font-size:16px;line-height:1.6;font-weight:bold;color:var(--ai)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center;margin-bottom:12px}
.stepname{font-weight:bold;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.tiles button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.tiles b{width:36px;height:36px;border-radius:10px;background:var(--ai);color:var(--gold);display:grid;place-items:center;font-size:17px}
/* サブタブ */
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 2px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:bold;color:var(--sub);cursor:pointer}
.subtabs button.on{background:var(--ai);border-color:var(--ai);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chipbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--sub)}
.chipbtn.on{background:var(--gold-l);border-color:var(--gold);color:var(--ai-d);font-weight:bold}
.seg{display:flex;gap:4px;background:#efebe4;padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--sub);font-weight:bold;min-width:70px}
.seg button.on{background:#fff;color:var(--ai);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* はじめに */
.intro section{padding:12px 0;border-top:1px solid #f0ebe3}
.intro h3{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px;color:var(--ai)}
.intro .num{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ai-d);display:grid;place-items:center;font-size:12px;flex:none}
.intro p{margin:0;line-height:1.85;font-size:15px}
.introhead{display:flex;gap:12px;align-items:center;padding-bottom:12px}
.introhead .t{font-weight:bold;font-size:18px;color:var(--ai)}
.logo{width:52px;height:52px;border-radius:14px;background:var(--ai);color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:20px;border:3px solid var(--gold);flex:none}
.inst{padding:10px 0;border-top:1px solid #f0ebe3}
.inst h3{font-size:15px;margin:0 0 6px;color:var(--ai)}
.inst p{margin:0;line-height:1.8;font-size:14px}
.pbar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.pbar i{display:block;height:100%;background:var(--gold)}
.sched{font-size:13px;font-weight:bold;padding:7px 10px;border-radius:9px;margin-bottom:10px}
.sched.ok{background:#e6f4ec;color:var(--ok)}
.sched.ng{background:#fde8e6;color:var(--ng)}
.schedtbl{background:#fbf3f1;border-radius:12px;padding:8px 12px;margin-top:10px}
.schedtbl .sh{font-size:12px;color:var(--sub);margin-bottom:4px}
.schedtbl .sr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #f0e2de;font-size:14px}
.schedtbl .sr:first-of-type{border-top:none}
.schedtbl .sr b{flex:1;color:var(--ai)}
.schedtbl .sr span{color:var(--ink);font-size:13px}
.schedtbl .sr em{font-style:normal;font-size:10px;background:var(--ai);color:#fff;padding:2px 7px;border-radius:6px}
.schedtbl .sr.now{font-weight:bold}
input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px;background:#fff}
.fi{text-align:center}
.fi .logo{margin:0 auto 10px}
.fistep{text-align:left;background:#fbf3f1;border-radius:12px;padding:10px 12px;margin-top:10px}
.fistep b{color:var(--ai);font-size:14px}
.fistep p{margin:4px 0 0;font-size:14px;line-height:1.75}
/* マインド */
.acc{padding:0;overflow:hidden}
.acchead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;padding:14px;cursor:pointer;text-align:left}
.acchead .ic{width:34px;height:34px;border-radius:9px;background:var(--ai);color:var(--gold);display:grid;place-items:center;font-weight:bold;flex:none}
.acchead .tt{flex:1;font-weight:bold;font-size:15px;color:var(--ai)}
.acchead .arr{color:var(--sub);transition:.2s}
.acc.open .arr{transform:rotate(180deg)}
.accbody{padding:0 16px 16px}
.accbody .lead{background:var(--gold-l);border-radius:10px;padding:10px 12px;font-weight:bold;line-height:1.6;margin:0 0 6px;color:var(--ai-d)}
.accbody h4{margin:16px 0 5px;font-size:14.5px;color:var(--ai);border-left:4px solid var(--gold);padding-left:8px}
.accbody p{margin:0;line-height:1.85;font-size:15px}
.accbody .btn{margin-top:16px}
.storebox{background:#fbf0ee;border-radius:10px;padding:4px 12px 10px;margin-top:8px}
.storebox h4{margin-top:10px}
.storebox ul{margin:4px 0;padding-left:20px;line-height:1.7}
/* 商品 */
.prod .pcat{font-size:11px;color:var(--gold);font-weight:bold;letter-spacing:.05em}
.prod h3{margin:2px 0 6px;font-size:17px;color:var(--ai)}
.pfeat{font-size:14px;line-height:1.7;color:#3c4350}
.talk{background:var(--ai);color:#fff;border-radius:12px;padding:12px;margin:10px 0}
.talk .lbl{font-size:11px;color:var(--gold);margin-bottom:4px}
.talk .say{font-size:16px;line-height:1.7;font-weight:bold}
.talk .mean{font-size:13px;line-height:1.6;opacity:.85;margin-top:8px;border-top:1px solid rgba(255,255,255,.2);padding-top:6px}
.prod dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;line-height:1.6}
.prod dt{font-weight:bold;color:var(--sub);font-size:12px;padding-top:2px;white-space:nowrap}
.prod dd{margin:0}
/* ステップ */
.step.cur{border:2px solid var(--gold)}
.step.done{opacity:.85}
.sitem{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #f0ebe3}
.sitem .stx{flex:1;font-size:14px;line-height:1.5}
.sitem.ok .stx{color:var(--ok)}
.sitem.ok .stx::before{content:"✓ ";font-weight:bold}
.sbtns{display:flex;gap:4px;flex:none}
.tg{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;font-size:11px;cursor:pointer;color:var(--sub);font-weight:bold}
.tg.on{background:var(--ai);border-color:var(--ai);color:#fff}
.tg.tr.on{background:var(--ok);border-color:var(--ok)}
/* テスト */
.qq{font-size:17px;line-height:1.6;margin:8px 0 12px}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;font-size:15px;line-height:1.5;cursor:pointer}
.qopt.right{border-color:var(--ok);background:#e6f4ec}
.qopt.bad{border-color:var(--ng);background:#fbe9e7}
.qfb{font-weight:bold;margin:6px 0 10px;line-height:1.5}
.qfb.r{color:var(--ok)}.qfb.w{color:var(--ng)}
/* チェック */
.datebar{display:flex;align-items:center;gap:8px}
.datebar input{width:auto}
.datebar .right{text-align:right}
.goalline{margin-top:10px;font-size:13px;line-height:1.7;color:var(--sub)}
.goalline b{color:var(--ai)}
.theme{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.theme:first-of-type{border-top:none;margin-top:0;padding-top:0}
.theme h3{font-size:14px;margin:0 0 4px;display:flex;align-items:center;gap:6px;color:var(--ai)}
.tag{font-size:10px;background:var(--gold);color:var(--ai-d);padding:2px 7px;border-radius:6px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0}
.item .txt{flex:1;font-size:14px;line-height:1.45}
.tri{display:flex;gap:4px;flex:none}
.tri button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:bold;color:#c0c3c9;cursor:pointer;padding:0}
.tri button.o.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tri button.d.on{background:var(--mid);border-color:var(--mid);color:#fff}
.tri button.x.on{background:var(--ng);border-color:var(--ng);color:#fff}
.tri button.na.on{background:#8a8f99;border-color:#8a8f99;color:#fff}
.counter{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px;font-weight:bold}
.counter div{display:flex;align-items:center;gap:12px}
.counter button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--ai)}
.counter b{min-width:28px;text-align:center;font-size:20px}
/* マンダラ */
.mandala{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cell{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;min-height:130px;position:relative;cursor:pointer;display:flex;flex-direction:column}
.cell .num{font-size:10px;color:var(--sub)}
.cell .ttl{font-weight:bold;font-size:13px;margin:2px 0 5px;color:var(--ai)}
.cell ul{margin:0;padding-left:14px;font-size:11px;line-height:1.45}
.cell .rate{margin-top:auto;padding-top:5px;font-size:12px;font-weight:bold}
.cell.center{background:var(--ai);border-color:var(--ai);color:#fff;justify-content:center;text-align:center}
.cell.center .ttl{color:var(--gold);font-size:14px}
.cell.center .lbl{font-size:10px;opacity:.8}
.cell .bigc{font-size:24px;font-weight:bold}
.cell.focus{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.cell.focus::after{content:attr(data-ftag);position:absolute;top:-9px;right:6px;background:var(--gold);color:var(--ai-d);font-size:9px;font-weight:bold;padding:1px 6px;border-radius:6px;white-space:nowrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* 週 */
.wtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.wtable th{font-size:11px;color:var(--sub);text-align:left;padding:4px}
.wtable td{padding:7px 4px;border-top:1px solid #f0ebe3}
.stars{display:flex;gap:3px}
.stars button{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);background:#fff;font-size:12px;cursor:pointer;color:#bbb;padding:0}
.stars button.on{background:var(--gold);border-color:var(--gold);color:var(--ai-d);font-weight:bold}
/* メモ */
.notec .nh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.notec .nh .muted{flex:1}
.notec .x{border:none;background:none;font-size:18px;color:#bbb;cursor:pointer}
.notec div:last-child{line-height:1.6;font-size:14px}
/* 記録 */
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{background:#efebe4;border:none;border-radius:9px;padding:6px 1px;text-align:center;font-size:10px;color:var(--sub);cursor:pointer}
.wd b{display:block;font-size:13px;color:var(--ink);margin-top:2px}
.wd[style*="background"] b{color:#fff}
.wd.today{outline:2px solid var(--ai)}
.heat{overflow-x:auto}
.heat table{border-collapse:collapse;font-size:11px;min-width:100%}
.heat th,.heat td{padding:3px 2px;text-align:center;border-bottom:1px solid #f3efe9;white-space:nowrap}
.heat .l{text-align:left;position:sticky;left:0;background:#fff;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.heat .grp{color:var(--ai);font-weight:bold;padding-top:8px}
.dot{display:inline-block;width:17px;height:17px;border-radius:4px;line-height:17px;color:#fff;font-weight:bold;font-size:10px}
.dot.o{background:var(--ok)}.dot.d{background:var(--mid)}.dot.x{background:var(--ng)}.dot.n{background:#f1ede7}.dot.na{background:#b9bcc2}
.log{border-left:4px solid var(--ai);padding:7px 10px;margin:8px 0;background:#fafaf8;border-radius:0 10px 10px 0;font-size:13px;line-height:1.6}
.log .k{display:block;font-size:11px;color:var(--sub);margin-top:3px}
.boss{display:inline-block;margin-top:4px;background:var(--gold-l);padding:3px 8px;border-radius:6px}
/* 報告 */
.report pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:1.7;margin:0}
/* 設定 */
.pedit{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid #f0ebe3;font-size:14px}
.pedit span{flex:1}
.pedit.off span{color:#aaa;text-decoration:line-through}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(40,8,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + var(--safe-b))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 10px;color:var(--ai)}
.sheet input[type=text]{margin-bottom:6px}
.sheet .list{display:flex;flex-direction:column;gap:6px}
.pmsg{line-height:1.7;font-size:15px}

/* ===== シンプルデザイン ===== */
:root{--bg:#f7f7f7;--line:#e6e6e6;--gold:#b3192b;--gold-l:#fbeeee}
header{box-shadow:none;padding-bottom:10px}
.hbtn,#langSel{background:rgba(255,255,255,.15);border-color:transparent}
.card{border-radius:12px;border-color:var(--line);box-shadow:none}
.hero{background:#fff;color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--ai);border-radius:12px}
.hero .muted2{color:var(--sub);opacity:1}
.hello{color:var(--ink)}
.pbar{background:#eee}.pbar i{background:var(--ai)}
.word{background:#fafafa;border-left:3px solid var(--ai);color:var(--ink)}
.word span{color:var(--ai)}
.banner{background:#fff;border:1px solid var(--line)}
.btn.gold{background:var(--ai);color:#fff}
.tiles{grid-template-columns:repeat(2,1fr)}
.tiles button{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px;font-size:13px;border-radius:10px}
.tiles b{width:auto;height:auto;background:none;color:var(--ai);font-size:15px}
.acchead .ic{background:none;color:var(--ai);border:1.5px solid var(--ai);width:28px;height:28px;border-radius:50%;font-size:13px}
.accbody .lead{background:#fafafa;color:var(--ink);border-left:3px solid var(--ai);border-radius:0 8px 8px 0}
.accbody h4{border-left:none;padding-left:0;color:var(--ai)}
.talk{background:#fafafa;color:var(--ink);border-left:3px solid var(--ai);border-radius:0 10px 10px 0}
.talk .lbl{color:var(--ai)}
.talk .mean{border-top-color:var(--line);opacity:1;color:var(--sub)}
.prod .pcat{color:var(--ai)}
.tag{background:var(--ai);color:#fff}
.cell.focus{border-color:var(--ai);box-shadow:none}
.cell.focus::after{background:var(--ai);color:#fff}
.cell.center{background:#fff;color:var(--ink);border-color:var(--ai)}
.cell.center .ttl{color:var(--ai)}
.cell.center .lbl{color:var(--sub);opacity:1}
.stars button.on{background:var(--ai);border-color:var(--ai);color:#fff}
.chipbtn.on{background:var(--ai);border-color:var(--ai);color:#fff}
.subtabs button.on{background:var(--ai);border-color:var(--ai)}
.step.cur{border:1.5px solid var(--ai)}
.boss{background:#f3f3f3}
.logo{background:#fff;color:var(--ai);border:2px solid var(--ai)}
.fistep,.schedtbl,.storebox{background:#fafafa}
.introhead{border-bottom:1px solid var(--line)}
.advintro{font-size:14px;line-height:1.8;margin:6px 0 8px}
.src{background:#fafafa;border-radius:8px;padding:8px 10px;margin-top:14px;font-size:11.5px;line-height:1.55;color:var(--sub)}
.src ul{margin:4px 0 0;padding-left:16px}
.src li{margin-bottom:3px;word-break:break-word}
.qrbox{display:flex;justify-content:center;padding:8px 0}
.qrbox svg{border:1px solid var(--line);border-radius:8px}
.urltxt{text-align:center;font-size:12px;color:var(--sub);word-break:break-all}
nav#bottomNav button.on svg{stroke:var(--ai)}
@media(max-width:400px){
  .cell{min-height:120px;padding:6px}.cell ul{font-size:10.5px;padding-left:12px}.cell .ttl{font-size:12px}
  .tri button{width:34px;height:36px}
}
@media print{
  header,nav,.banner,.subtabs,.row,.btn{display:none!important}
  body{background:#fff;padding:0}.card{border:none;break-inside:avoid}
}
</style>
</head>

<script>
/* ===================== 教材コンテンツ（ja / en / zh / vi） ===================== */
const LANGS = [
  {id:"ja", label:"日本語"},
  {id:"en", label:"English"},
  {id:"zh", label:"中文"},
  {id:"vi", label:"Tiếng Việt"}
];

/* ---------- マインド：良い接客とは ---------- */
const MIND = [
{
 id:"m1", icon:"心",
 title:{ja:"良い接客ってそもそも何？",en:"What is good service, really?",zh:"什么才是好的服务？",vi:"Phục vụ tốt thực ra là gì?"},
 lead:{ja:"良い接客とは、お客様が帰り道に「来てよかった」「また来たい」と思える時間をつくること。",
       en:"Good service means creating time that makes guests think on the way home, \"I'm glad I came. I want to come back.\"",
       zh:"好的服务，就是让客人在回家路上想着“来对了”“还想再来”。",
       vi:"Phục vụ tốt là tạo ra khoảng thời gian khiến khách trên đường về nghĩ: \"Đến đây thật đúng, mình muốn quay lại.\""},
 body:[
  {h:{ja:"「正しい接客」と「良い接客」は違う",en:"\"Correct\" service and \"good\" service are different",zh:"“正确的服务”和“好的服务”不一样",vi:"Phục vụ \"đúng\" và phục vụ \"tốt\" là khác nhau"},
   p:{ja:"マニュアル通りの挨拶・提供・会計は「正しい接客」で、できて当たり前の土台です。良い接客は、その土台の上に「このお客様に今なにが必要か」を考えて一言や行動を足すこと。同じ「いらっしゃいませ」でも、雨の日なら「足元の悪い中ありがとうございます」と言えるかどうかの差です。",
      en:"Greeting, serving and checkout by the manual are \"correct\" service: the basic foundation everyone must do. Good service adds a word or action on top, thinking \"what does this guest need right now?\" On a rainy day, can you add \"Thank you for coming in this weather\" to your welcome? That is the difference.",
      zh:"按照手册打招呼、上菜、结账是“正确的服务”，是必须做到的基础。好的服务是在这个基础上，思考“这位客人现在需要什么”，再多加一句话或一个动作。比如下雨天，能不能在“欢迎光临”之后加一句“下雨天还特地过来，谢谢您”，差别就在这里。",
      vi:"Chào hỏi, mang món, thanh toán theo đúng hướng dẫn là phục vụ \"đúng\" – nền tảng ai cũng phải làm được. Phục vụ tốt là trên nền đó, suy nghĩ \"vị khách này đang cần gì\" rồi thêm một câu nói hay một hành động. Ví dụ ngày mưa, bạn có nói thêm \"Cảm ơn quý khách đã đến dù trời mưa\" hay không – đó chính là sự khác biệt."}},
  {h:{ja:"期待を「少しだけ」超える",en:"Exceed expectations \"just a little\"",zh:"“稍微”超出期待",vi:"Vượt mong đợi \"một chút\""},
   p:{ja:"お客様は来店前に「これくらいだろう」という期待を持っています。期待を下回ると不満、同じなら普通、少し上回ると感動になります。大げさなサービスは必要ありません。おかわりを先に聞く、熱い料理に一言添える、名前や前回の注文を覚えている。小さな「少しだけ」の積み重ねがリピートを生みます。",
      en:"Guests arrive with an expectation. Below it they are unhappy, equal to it is normal, a little above it moves them. No big show is needed: ask about a refill before they call you, add a word with hot food, remember a regular's last order. Small \"little extras\" add up to repeat visits.",
      zh:"客人来店前心里有一个“大概就这样”的期待。低于期待会不满，持平是普通，稍微超出就会感动。不需要夸张的服务：在客人叫你之前先问要不要续杯，上热菜时提醒一句，记住熟客上次点了什么。这些小小的“多一点”累积起来，就会带来回头客。",
      vi:"Khách đến với một mức kỳ vọng. Thấp hơn thì không hài lòng, bằng thì bình thường, cao hơn một chút thì cảm động. Không cần phục vụ phô trương: hỏi thêm đồ uống trước khi khách gọi, nhắc một câu khi mang món nóng, nhớ món lần trước của khách quen. Những điều \"thêm một chút\" nhỏ đó tạo ra khách quay lại."}},
  {h:{ja:"主役はいつもお客様",en:"The guest is always the main character",zh:"主角永远是客人",vi:"Nhân vật chính luôn là khách"},
   p:{ja:"忙しいとき、つい「自分の作業」が中心になります。でもお客様にとって店の忙しさは関係ありません。手を動かしながらも顔はお客様へ。呼ばれる前に目が合う距離感を保つことが、ホールの基本姿勢です。",
      en:"When busy, your own tasks become the center. But the guest does not care how busy the shop is. Keep your hands working and your face toward the guests. Staying where you can make eye contact before you are called is the basic stance on the floor.",
      zh:"忙的时候，很容易以“自己的工作”为中心。但店里忙不忙，和客人无关。手在做事，脸要朝向客人。保持在被叫之前就能和客人对上眼的距离，是大厅服务的基本姿态。",
      vi:"Khi bận, ta dễ lấy \"việc của mình\" làm trung tâm. Nhưng khách không quan tâm quán bận thế nào. Tay vẫn làm, mặt hướng về khách. Giữ khoảng cách mà khách có thể bắt gặp ánh mắt bạn trước khi gọi – đó là tư thế cơ bản khi phục vụ sảnh."}}
 ]
},
{
 id:"m2", icon:"柱",
 title:{ja:"なぜホールを重要視するのか",en:"Why we value the floor (hall) so much",zh:"为什么我们重视大厅服务",vi:"Vì sao chúng ta coi trọng phục vụ sảnh"},
 lead:{ja:"味は厨房がつくる。でも「この店の体験」をつくるのはホール。",
       en:"The kitchen makes the taste. The floor staff make the experience of the shop.",
       zh:"味道由厨房决定，但“这家店的体验”由大厅创造。",
       vi:"Bếp tạo ra hương vị. Nhưng \"trải nghiệm ở quán\" là do nhân viên sảnh tạo ra."},
 body:[
  {h:{ja:"理由1　お客様が一番長く接するのはホール",en:"Reason 1: Guests spend the most time with floor staff",zh:"理由1　客人接触最久的是大厅",vi:"Lý do 1: Khách tiếp xúc lâu nhất với nhân viên sảnh"},
   p:{ja:"入店から退店まで、お客様が顔を合わせるのはほぼホールだけです。料理がどれだけおいしくても、案内が冷たい、呼んでも来ない、それだけで「また来たい」は消えます。逆に、普通の料理でもホールの一言で特別な時間になります。",
      en:"From entry to exit, floor staff are almost the only people guests meet. However good the food, a cold welcome or no response when called erases \"I want to come back\". On the other hand, one word from the floor can make an ordinary meal special.",
      zh:"从进店到离店，客人见到的几乎只有大厅员工。菜再好吃，只要接待冷淡、叫了没人来，“还想再来”就消失了。反过来，大厅的一句话，能让普通的一餐变成特别的时光。",
      vi:"Từ lúc vào đến lúc ra, khách gần như chỉ gặp nhân viên sảnh. Món ăn ngon đến đâu, chỉ cần đón tiếp lạnh nhạt hay gọi không ai đến là \"muốn quay lại\" biến mất. Ngược lại, một câu nói của bạn có thể biến bữa ăn bình thường thành đặc biệt."}},
  {h:{ja:"理由2　客単価を上げられるのはホールだけ",en:"Reason 2: Only the floor can raise spend per guest",zh:"理由2　只有大厅能提高客单价",vi:"Lý do 2: Chỉ sảnh mới tăng được chi tiêu mỗi khách"},
   p:{ja:"もう一杯、もう一品、締めのデザート。お客様が「知らなかったおいしいもの」に出会えるのは、ホールが紹介したときだけです。提案は売り込みではなく、お客様の満足を増やす行動。結果として店の売上も上がります。",
      en:"One more drink, one more dish, a dessert to finish. Guests only meet \"tasty things they didn't know\" when floor staff introduce them. Suggesting is not pushing; it increases guest satisfaction, and as a result, sales rise too.",
      zh:"再来一杯、再加一道、最后来份甜点。客人只有在大厅介绍时，才能遇到“原本不知道的美味”。推荐不是推销，而是增加客人满足感的行为，结果店的营业额也会提高。",
      vi:"Thêm một ly, thêm một món, món tráng miệng cuối bữa. Khách chỉ gặp được \"món ngon chưa biết\" khi nhân viên sảnh giới thiệu. Gợi ý không phải ép bán, mà là tăng sự hài lòng của khách – kết quả là doanh thu cũng tăng."}},
  {h:{ja:"理由3　口コミと評価はホールで決まる",en:"Reason 3: Reviews are decided by the floor",zh:"理由3　口碑和评价由大厅决定",vi:"Lý do 3: Đánh giá trên mạng do sảnh quyết định"},
   p:{ja:"ネットの口コミで多く書かれるのは「店員さんが感じよかった」「対応が残念だった」という体験です。1人の対応が、まだ来ていない何百人のお客様の来店を左右します。",
      en:"Online reviews often mention \"the staff were nice\" or \"the service was disappointing\". One person's service affects whether hundreds of future guests come.",
      zh:"网上评价最常写的是“店员很亲切”或“服务很差”。一个人的接待，会影响尚未来店的几百位客人。",
      vi:"Đánh giá trên mạng thường viết \"nhân viên dễ thương\" hoặc \"phục vụ đáng thất vọng\". Cách phục vụ của một người ảnh hưởng đến việc hàng trăm khách tương lai có đến hay không."}},
  {h:{ja:"理由4　ホールは「お店の顔」",en:"Reason 4: The floor is the face of the shop",zh:"理由4　大厅是“店的门面”",vi:"Lý do 4: Sảnh là \"bộ mặt của quán\""},
   p:{ja:"仕事帰りの方、記念日の方、観光で訪れた方。お客様はそれぞれ違う期待を持って来店します。気軽さと、きちんとした気配り。その両方を、目の前のお客様に合わせて届けられるのがホールです。お客様にとっては、あなたの対応がそのまま「この店の印象」になります。",
      en:"People after work, people celebrating, tourists: each guest comes with different expectations. Casual comfort and proper care, matched to the guest in front of you: only the floor can deliver both. To the guest, your service becomes the impression of the whole shop.",
      zh:"下班的人、庆祝纪念日的人、来观光的人，每位客人都带着不同的期待来店。轻松自在和细致周到，能根据眼前的客人同时传递这两者的，就是大厅。对客人来说，你的接待就是“这家店的印象”。",
      vi:"Người tan làm, người kỷ niệm, khách du lịch: mỗi người đến với kỳ vọng khác nhau. Sự thoải mái và sự chu đáo, phù hợp với vị khách trước mặt – chỉ sảnh mới mang lại được cả hai. Với khách, cách bạn phục vụ chính là \"ấn tượng về quán\"."}},
  {h:{ja:"理由5　チームの空気をつくるのもホール",en:"Reason 5: The floor sets the team's mood",zh:"理由5　团队氛围也由大厅营造",vi:"Lý do 5: Sảnh tạo ra không khí của cả đội"},
   p:{ja:"ホールの声と表情は、店全体の空気になります。明るい声が出ている店は、厨房も元気になり、お客様も楽しくなります。ホールは店の「温度計」であり「エンジン」です。",
      en:"The floor's voice and expression become the mood of the whole shop. When cheerful voices are heard, the kitchen is energized and guests have more fun. The floor is both the thermometer and the engine of the shop.",
      zh:"大厅的声音和表情，就是整个店的氛围。声音明亮的店，厨房也会有活力，客人也更开心。大厅既是店的“温度计”，也是“发动机”。",
      vi:"Giọng nói và nét mặt của sảnh trở thành không khí của cả quán. Quán có tiếng nói vui vẻ thì bếp cũng hăng hái, khách cũng vui hơn. Sảnh vừa là \"nhiệt kế\" vừa là \"động cơ\" của quán."}}
 ]
},
{
 id:"m3", icon:"眼",
 title:{ja:"接客の3つの柱",en:"Three pillars of service",zh:"服务的三大支柱",vi:"Ba trụ cột của phục vụ"},
 lead:{ja:"見る → 気づく → 伝える。この順番を毎回まわす。",
       en:"Look → Notice → Communicate. Run this cycle every time.",
       zh:"看 → 察觉 → 传达。每次都按这个顺序。",
       vi:"Nhìn → Nhận ra → Truyền đạt. Lặp lại vòng này mỗi lần."},
 body:[
  {h:{ja:"1. 見る（観察）",en:"1. Look (observe)",zh:"1. 看（观察）",vi:"1. Nhìn (quan sát)"},
   p:{ja:"卓の横を通るたびに、グラスの残り・空いた皿・表情・視線・メニューを開いているかを見る。ドリンクを作る前、戻る前に、フロアを一周見渡すクセをつける。",
      en:"Each time you pass a table, check drinks left, empty plates, faces, eye direction, and whether the menu is open. Make it a habit to scan the whole floor before making drinks or going back.",
      zh:"每次经过桌边，都看看杯里还剩多少、有没有空盘、客人的表情和视线、是否打开了菜单。养成在做饮料前、回去前先环视整个大厅的习惯。",
      vi:"Mỗi lần đi ngang bàn, nhìn ly còn bao nhiêu, đĩa trống, nét mặt, ánh mắt, khách có đang mở thực đơn không. Tập thói quen nhìn quanh cả sảnh trước khi pha đồ uống hay quay vào."}},
  {h:{ja:"2. 気づく（先読み）",en:"2. Notice (anticipate)",zh:"2. 察觉（预判）",vi:"2. Nhận ra (đoán trước)"},
   p:{ja:"グラス残り3分の1は「おかわりの合図」。メニューを閉じたら「注文が決まった合図」。キョロキョロしていたら「呼びたい合図」。お客様のサインを、呼ばれる前に受け取ろう。",
      en:"One third left in the glass = time for a refill. Menu closed = ready to order. Looking around = wants to call you. Catch these signs before you are called.",
      zh:"杯子剩三分之一＝该续杯了。合上菜单＝点好了。四处张望＝想叫人。要在被叫之前接收到客人的信号。",
      vi:"Ly còn 1/3 = tín hiệu thêm đồ uống. Đóng thực đơn = đã chọn xong. Nhìn quanh = muốn gọi. Hãy nhận tín hiệu trước khi bị gọi."}},
  {h:{ja:"3. 伝える（言葉と表情）",en:"3. Communicate (words and expression)",zh:"3. 传达（语言和表情）",vi:"3. Truyền đạt (lời nói và nét mặt)"},
   p:{ja:"目を見て、笑顔で、相手に届く声の大きさで。「お待たせしました」の後に商品名、熱いものには一言。言葉は短く、表情は明るく。伝わらなければ、言っていないのと同じ。",
      en:"Eye contact, a smile, a voice loud enough to reach them. After \"Thank you for waiting\", say the item name; add a warning for hot food. Keep words short and expression bright. If it doesn't reach them, it's the same as not saying it.",
      zh:"看着对方的眼睛，带着笑容，用对方听得到的音量。“让您久等了”之后说出菜名，热的东西提醒一句。话要简短，表情要明亮。没传达到，就等于没说。",
      vi:"Nhìn vào mắt, mỉm cười, nói đủ lớn để khách nghe. Sau \"Xin lỗi đã để quý khách chờ\" hãy nói tên món, món nóng thì nhắc một câu. Lời ngắn gọn, nét mặt tươi sáng. Không truyền đến được thì cũng như chưa nói."}}
 ]
},
{
 id:"m4", icon:"客",
 title:{ja:"お客様に合わせた対応",en:"Adapting to each type of guest",zh:"针对不同客人的应对",vi:"Ứng xử theo từng kiểu khách"},
 lead:{ja:"同じ対応を全員にするのではなく、相手に合わせて変える。",
       en:"Don't treat everyone the same; adjust to each guest.",
       zh:"不是对所有人都一样，而是根据对方调整。",
       vi:"Đừng đối xử với ai cũng như nhau, hãy điều chỉnh theo từng khách."},
 body:[
  {h:{ja:"初めてのお客様",en:"First-time guests",zh:"第一次来的客人",vi:"Khách đến lần đầu"},
   p:{ja:"「当店は初めてですか？」と聞き、初めてなら店の特徴やルールを一言で伝える（「お店の案内とルールの伝え方」参照）。初めての店は誰でも少し不安。不安をなくすと、注文も会話も増えます。",
      en:"Ask \"Is this your first time here?\" If yes, give one line on the shop's features or rules (see \"Explaining shop info and rules\"). Everyone is a little nervous in a new place. Remove that worry and orders and conversation increase.",
      zh:"问“您是第一次来吗？”，如果是，就用一句话介绍店的特点或规则（参见“店铺介绍和规则的说明方法”）。第一次来的店谁都会有点不安。消除不安，点单和交流都会增加。",
      vi:"Hỏi \"Quý khách đến lần đầu phải không ạ?\". Nếu đúng, giới thiệu ngắn đặc điểm hoặc quy định của quán (xem \"Cách giới thiệu quán và nói quy định\"). Ai đến chỗ mới cũng hơi lo. Xóa lo lắng thì khách gọi món và trò chuyện nhiều hơn."}},
  {h:{ja:"常連のお客様",en:"Regular guests",zh:"熟客",vi:"Khách quen"},
   p:{ja:"「いつもありがとうございます」と覚えていることを伝える。前回の注文や好みを覚えていれば最強。ただし馴れ馴れしくしすぎない。",
      en:"Show you remember them: \"Thank you for always coming.\" Remembering their usual order is the strongest move. But don't be overly familiar.",
      zh:"说“一直以来谢谢您”，让对方知道你记得他。如果记得上次点的菜和喜好就最好了。但不要过于随便。",
      vi:"Cho khách biết bạn nhớ họ: \"Cảm ơn quý khách luôn ghé quán.\" Nhớ món lần trước hay sở thích là tuyệt nhất. Nhưng đừng quá suồng sã."}},
  {h:{ja:"時間を気にしているお客様",en:"Guests in a hurry",zh:"赶时间的客人",vi:"Khách đang vội"},
   p:{ja:"電車やイベントの前など、急いでいる方がいます。時計を見ている方には「お時間はお決まりですか？」と聞き、早く出せる商品を案内。提供時間の目安を伝えると安心されます。",
      en:"Some guests are rushing before a train or an event. If someone checks the time, ask \"Do you have a set time?\" and suggest quick items. Telling them how long it will take reassures them.",
      zh:"有些客人赶电车或活动，时间很紧。看到客人看表，就问“您有时间限制吗？”，并推荐能快速上的菜。告诉对方大约多久上菜，客人会更安心。",
      vi:"Có khách đang vội trước giờ tàu hay sự kiện. Thấy khách nhìn đồng hồ, hỏi \"Quý khách có giới hạn thời gian không ạ?\" và gợi ý món ra nhanh. Báo trước thời gian chờ khiến khách yên tâm."}},
  {h:{ja:"海外からのお客様",en:"Guests from overseas",zh:"海外客人",vi:"Khách nước ngoài"},
   p:{ja:"多言語メニューや案内があれば渡し、笑顔とジェスチャーで。英語が完璧でなくても、短い定型フレーズを堂々と使うことが大切。熱い料理は必ず伝える（Very hot, please be careful）。",
      en:"Hand over a multilingual menu or guide if you have one; use smiles and gestures. Your English doesn't need to be perfect; using short set phrases confidently matters. Always warn about hot food (\"Very hot, please be careful\").",
      zh:"如果有多语言菜单或指南就递上，用笑容和手势沟通。英语不完美也没关系，自信地使用简短的固定句子最重要。热的菜一定要提醒（Very hot, please be careful）。",
      vi:"Nếu có thực đơn hay hướng dẫn nhiều ngôn ngữ thì đưa cho khách, dùng nụ cười và cử chỉ. Tiếng Anh không cần hoàn hảo, quan trọng là tự tin dùng câu mẫu ngắn. Món nóng nhất định phải nhắc (\"Very hot, please be careful\")."}},
  {h:{ja:"お一人様",en:"Solo guests",zh:"一个人来的客人",vi:"Khách đi một mình"},
   p:{ja:"居心地のよさが最優先。話しかけすぎず、でも放置しない。量が少なめのメニューやハーフサイズを案内すると喜ばれます。",
      en:"Comfort comes first. Don't talk too much, but don't leave them alone either. Suggesting smaller or half portions is appreciated.",
      zh:"舒适最重要。不要搭话太多，也不要冷落。推荐分量少或半份的菜，客人会很高兴。",
      vi:"Sự thoải mái là ưu tiên. Đừng nói chuyện quá nhiều nhưng cũng đừng bỏ mặc. Gợi ý món phần nhỏ hoặc nửa phần sẽ được khách thích."}},
  {h:{ja:"グループ・宴会",en:"Groups and parties",zh:"团体和宴会",vi:"Nhóm và tiệc"},
   p:{ja:"幹事さんを見つけて、幹事さんに確認する。乾杯のドリンクはスピード最優先。シェアしやすい料理を提案し、取り皿の数も先に確認。",
      en:"Find the organizer and confirm things with them. Speed is top priority for the toast drinks. Suggest easy-to-share dishes and check the number of small plates first.",
      zh:"找到组织者，和组织者确认。干杯的饮料速度第一。推荐方便分享的菜，并先确认分食盘的数量。",
      vi:"Tìm người tổ chức và xác nhận với họ. Đồ uống cụng ly phải nhanh nhất. Gợi ý món dễ chia và hỏi trước số đĩa nhỏ."}},
  {h:{ja:"ご利用いただけないお客様への対応",en:"When you must decline a guest",zh:"需要拒绝客人时",vi:"Khi phải từ chối khách"},
   p:{ja:"満席、年齢制限（20歳未満の方へはお酒を提供できない等）、ルール上お受けできない場合。断るだけで終わらせず、「〇時頃なら空いています」「テイクアウトならご用意できます」など代わりを案内する。断り方で店の印象が決まります。",
      en:"Full house, age limits (no alcohol for under-20s, etc.), or rules that prevent service. Don't just refuse; offer an alternative: \"We should have seats around ○ o'clock\" or \"Takeout is available.\" How you refuse decides the impression of the shop.",
      zh:"满座、年龄限制（不能向未满20岁的人提供酒等）、规定上无法接待的情况。不要只是拒绝，要提出替代方案：“〇点左右会有空位”“外带可以为您准备”。拒绝的方式决定店的印象。",
      vi:"Hết chỗ, giới hạn tuổi (không phục vụ rượu cho người dưới 20 tuổi…), hoặc quy định không cho phép. Đừng chỉ từ chối, hãy đưa phương án khác: \"Khoảng ○ giờ sẽ có chỗ\", \"Mua mang về thì được ạ\". Cách từ chối quyết định ấn tượng về quán."}}
 ]
},
{
 id:"m5", icon:"提",
 title:{ja:"提案（サジェスト）の考え方",en:"How to think about suggesting",zh:"推荐的思路",vi:"Cách suy nghĩ về gợi ý món"},
 lead:{ja:"提案は売り込みではない。お客様がまだ知らない「おいしい」を紹介すること。",
       en:"Suggesting is not pushing. It's introducing a \"delicious\" the guest doesn't know yet.",
       zh:"推荐不是推销，而是介绍客人还不知道的“美味”。",
       vi:"Gợi ý không phải ép bán, mà là giới thiệu món \"ngon\" khách chưa biết."},
 body:[
  {h:{ja:"提案の3ステップ",en:"Three steps of a suggestion",zh:"推荐三步骤",vi:"Ba bước gợi ý"},
   p:{ja:"①観察：グラスの残り、食事の進み具合、会話の雰囲気を見る。②一言：「〜はいかがですか」ではなく理由を添える（「熱い料理の後に冷たいデザートがちょうどいいです」）。③選択肢：「AとBならどちらがお好みですか」と選びやすくする。",
      en:"1) Observe: drinks left, eating pace, mood of the conversation. 2) One line with a reason: not just \"How about…?\" but \"Something cold and sweet is perfect after hot food.\" 3) Options: make it easy, \"Would you prefer A or B?\"",
      zh:"①观察：杯里剩多少、吃的进度、聊天气氛。②一句话加理由：不只是“要不要来个～”，而是“吃完热菜，来份冰凉甜点正好”。③给选项：“A和B您更喜欢哪个？”让客人容易选择。",
      vi:"① Quan sát: đồ uống còn bao nhiêu, tốc độ ăn, không khí câu chuyện. ② Một câu có lý do: không chỉ \"Quý khách dùng thêm…?\" mà \"Sau món nóng, món tráng miệng lạnh rất hợp ạ.\" ③ Đưa lựa chọn: \"Quý khách thích A hay B ạ?\" để khách dễ chọn."}},
  {h:{ja:"タイミングが8割",en:"Timing is 80%",zh:"时机占八成",vi:"Thời điểm chiếm 80%"},
   p:{ja:"一杯目の注文時、グラス残り3分の1、料理が出そろった後、会話が落ち着いた締めの時間。この4つが提案のチャンス。忙しそうな会話の途中には割り込まない。",
      en:"When taking the first order, when a glass is one-third full, after all dishes arrive, and at the calm end of the meal: these four moments are chances. Don't interrupt a lively conversation.",
      zh:"点第一杯时、杯子剩三分之一时、菜上齐后、聊天平静下来的收尾时。这四个时机是推荐的机会。不要打断正热烈的谈话。",
      vi:"Lúc gọi ly đầu tiên, khi ly còn 1/3, sau khi món ra đủ, lúc cuối bữa khi câu chuyện lắng xuống: bốn thời điểm này là cơ hội. Đừng chen vào lúc khách đang nói chuyện sôi nổi."}},
  {h:{ja:"断られても笑顔で終える",en:"End with a smile even if they say no",zh:"被拒绝也要笑着结束",vi:"Bị từ chối vẫn kết thúc bằng nụ cười"},
   p:{ja:"「かしこまりました、またいつでもお声がけください」で終われば、断られた提案もお客様の安心になります。断られた数は経験値。気にしすぎない。",
      en:"End with \"Certainly, please call me anytime,\" and even a declined suggestion makes the guest feel at ease. Each \"no\" is experience. Don't worry too much.",
      zh:"用“好的，有需要随时叫我”结束，即使被拒绝的推荐也会让客人安心。被拒绝的次数就是经验值，不要太在意。",
      vi:"Kết thúc bằng \"Vâng ạ, quý khách cần gì cứ gọi em\", thì dù bị từ chối khách vẫn thấy dễ chịu. Mỗi lần bị từ chối là kinh nghiệm. Đừng bận tâm quá."}}
 ]
},
{
 id:"m6", icon:"店",
 title:{ja:"お店の案内とルールの伝え方",en:"Explaining shop info and rules",zh:"店铺介绍和规则的说明方法",vi:"Cách giới thiệu quán và nói quy định"},
 lead:{ja:"お客様に聞かれたら、迷わず笑顔で答えられるようにする。",
       en:"Be able to answer guests' questions with a smile, without hesitating.",
       zh:"被客人问到时，要能毫不犹豫地笑着回答。",
       vi:"Khi khách hỏi, phải trả lời được ngay với nụ cười."},
 body:[
  {h:{ja:"最初に覚えておくお店の情報",en:"Shop information to learn first",zh:"首先要记住的店铺信息",vi:"Thông tin quán cần nhớ trước"},
   p:{ja:"次の項目は、研修担当から直接教わって覚えましょう。席での喫煙ルール／Wi-Fiの有無／予約の受け方（何名様から）／混雑時の時間制／年齢による制限／テイクアウトの方法／忘れ物の扱い／比較的空いている時間帯。メモする時は、気づきメモにお店の名前や住所を書かないようにしましょう。",
      en:"Learn these directly from your trainer: smoking rules at the table / Wi-Fi / how reservations work (from how many people) / time limits when busy / age limits / takeout / lost items / quiet hours. When you take notes, don't write the shop's name or address in Notes.",
      zh:"以下项目请直接向培训负责人学习并记住：座位吸烟规定／有无Wi-Fi／预约方式（几位起）／拥挤时的时间限制／年龄限制／外带方式／遗失物品处理／比较空的时段。记笔记时，不要在察觉笔记里写店名或地址。",
      vi:"Hãy học trực tiếp từ người phụ trách: quy định hút thuốc tại bàn / Wi-Fi / cách nhận đặt chỗ (từ mấy người) / giới hạn thời gian khi đông / giới hạn tuổi / cách mua mang về / đồ bỏ quên / giờ vắng. Khi ghi chú, đừng ghi tên hay địa chỉ quán vào Ghi chú."}},
  {h:{ja:"ルールは前向きに伝える",en:"Present rules positively",zh:"积极地说明规则",vi:"Nói quy định theo hướng tích cực"},
   p:{ja:"「申し訳ございませんが」だけで終わらせず、「〜となっております。ごゆっくりどうぞ」と前向きに。時間制などのルールは、席に案内した最初に伝えると、後でお客様を嫌な気持ちにさせません。",
      en:"Don't stop at \"I'm sorry, but…\"; say \"…is our policy. Please enjoy your time.\" Telling time limits and other rules right when seating guests avoids bad feelings later.",
      zh:"不要只说“非常抱歉”，要积极地说“我们是～的规定，请慢慢享用”。时间限制等规则在带位时一开始就说明，之后就不会让客人不愉快。",
      vi:"Đừng chỉ nói \"Xin lỗi nhưng…\", hãy nói \"Quán có quy định…, chúc quý khách vui vẻ.\" Nói quy định như giới hạn thời gian ngay khi dẫn khách vào chỗ sẽ tránh làm khách khó chịu về sau."}},
  {h:{ja:"空いている時間を伝えて次の来店につなげる",en:"Tell guests about quiet times for their next visit",zh:"告诉客人人少的时段，促成下次来店",vi:"Cho khách biết giờ vắng để lần sau ghé"},
   p:{ja:"混雑でお待たせしたお客様や、ゆっくりしたい方に「この時間帯はゆったり過ごせます」と伝えると、次の来店理由になります。",
      en:"Telling guests who waited, or who want to relax, \"You can take it easy at these times\" gives them a reason to return.",
      zh:"对等过位的客人或想慢慢享用的客人说“这个时段可以很悠闲”，就成了下次来店的理由。",
      vi:"Nói với khách đã phải chờ hoặc muốn thư thả \"Khung giờ này quý khách có thể thong thả\" sẽ tạo lý do để họ quay lại."}}
 ]
},
{
 id:"m7", icon:"禁",
 title:{ja:"やってはいけない接客",en:"Service you must never do",zh:"绝对不能做的服务",vi:"Những điều tuyệt đối không làm"},
 lead:{ja:"どれか1つでお客様の「また来たい」は消える。",
       en:"Any one of these can erase \"I want to come back\".",
       zh:"只要有一条，客人的“还想再来”就会消失。",
       vi:"Chỉ một điều thôi cũng xóa mất \"muốn quay lại\"."},
 body:[
  {h:{ja:"NG行動",en:"Never",zh:"禁止行为",vi:"Không được"},
   p:{ja:"お客様の前でスタッフ同士の私語・笑い声／呼ばれて「少々お待ちください」だけで戻らない／無言で皿を置く・下げる／「〇〇でいいですか？」など相手を軽く扱う言い方／腕組み・ポケットに手・スマホ操作／忙しさを顔に出す・ため息／注文の聞き返しをしない（間違いの原因）／できないことを「たぶん大丈夫です」とあいまいに答える",
      en:"Private chatting or laughing among staff in front of guests / Saying \"One moment\" and never coming back / Placing or clearing plates silently / Careless wording like \"This is fine, right?\" / Arms crossed, hands in pockets, using a phone / Showing you are busy, sighing / Not repeating orders back (causes mistakes) / Answering vaguely \"probably OK\" about things you can't do",
      zh:"在客人面前员工之间闲聊、大笑／被叫后只说“请稍等”却不回来／不说话就放盘、收盘／“这个就行了吧？”这种轻率的说法／抱臂、手插口袋、玩手机／把忙碌写在脸上、叹气／不复述点单（导致出错）／对做不到的事含糊地回答“应该没问题”",
      vi:"Nói chuyện riêng, cười đùa giữa nhân viên trước mặt khách / Nói \"Xin chờ một chút\" rồi không quay lại / Đặt hay dọn đĩa mà không nói gì / Nói kiểu xem nhẹ như \"Món này được chứ ạ?\" / Khoanh tay, tay đút túi, dùng điện thoại / Để lộ vẻ bận rộn, thở dài / Không nhắc lại món đã gọi (gây nhầm lẫn) / Trả lời mơ hồ \"chắc được ạ\" với việc không làm được"}},
  {h:{ja:"迷ったら",en:"When in doubt",zh:"拿不准时",vi:"Khi phân vân"},
   p:{ja:"「確認してまいります」と言って、必ず社員・先輩に確認して戻る。分からないことを正直に確認できる人が、一番信頼されます。",
      en:"Say \"Let me check for you,\" ask a manager or senior, and always come back. People who honestly check what they don't know are the most trusted.",
      zh:"说“我去确认一下”，一定要向正式员工或前辈确认后回来。能诚实确认不懂之事的人，最值得信赖。",
      vi:"Nói \"Để em kiểm tra ạ\", hỏi quản lý hoặc người đi trước rồi nhất định quay lại. Người thành thật hỏi lại điều mình không biết là người được tin tưởng nhất."}}
 ]
},
{
 id:"m8", icon:"道",
 title:{ja:"成長し続けるための心得",en:"Mindset for continuous growth",zh:"持续成长的心得",vi:"Tâm thế để không ngừng tiến bộ"},
 lead:{ja:"才能ではなく、毎日の小さな意識の積み重ね。",
       en:"Not talent, but small daily awareness, piled up.",
       zh:"不是天赋，而是每天小小意识的积累。",
       vi:"Không phải tài năng, mà là sự tích lũy ý thức nhỏ mỗi ngày."},
 body:[
  {h:{ja:"毎日1つだけ決めて、毎日振り返る",en:"Choose one thing a day, reflect every day",zh:"每天只定一件事，每天回顾",vi:"Mỗi ngày chọn một điều, mỗi ngày nhìn lại"},
   p:{ja:"全部を一度に完璧にする必要はありません。「明日いちばん意識すること」を1つ決めて、次の日に振り返る。この小さなサイクルを続けた人が、いちばん伸びます。",
      en:"You don't need to do everything perfectly at once. Choose one \"thing to focus on tomorrow\" and review it the next day. Those who keep this small cycle going grow the most.",
      zh:"不需要一次就全部做到完美。决定一件“明天最要注意的事”，第二天回顾。坚持这个小循环的人成长最快。",
      vi:"Không cần làm hoàn hảo mọi thứ một lúc. Chọn một \"điều chú ý nhất ngày mai\" và hôm sau nhìn lại. Người duy trì vòng nhỏ này sẽ tiến bộ nhiều nhất."}},
  {h:{ja:"気づきを書き残す",en:"Write down what you notice",zh:"把察觉记录下来",vi:"Ghi lại điều nhận ra"},
   p:{ja:"お客様に言われてうれしかった言葉、先輩のうまい一言、失敗したこと。書いた気づきはあなただけの教科書になります。このアプリの「気づきメモ」を使ってください。",
      en:"Words from guests that made you happy, a senior's great line, your mistakes. Notes you write become your own textbook. Use the \"Notes\" in this app.",
      zh:"客人让你开心的话、前辈说得好的一句、自己的失败。写下的察觉会成为你自己的教科书。请使用本应用的“察觉笔记”。",
      vi:"Lời khách nói khiến bạn vui, câu nói hay của người đi trước, lỗi của mình. Những ghi chép đó trở thành sách giáo khoa của riêng bạn. Hãy dùng \"Ghi chú\" trong ứng dụng này."}},
  {h:{ja:"うまい人をまねる",en:"Copy people who do it well",zh:"模仿做得好的人",vi:"Bắt chước người làm giỏi"},
   p:{ja:"接客がうまい先輩の言葉・立ち位置・タイミングを観察してまねる。まねは最短の上達方法です。",
      en:"Watch the words, position and timing of seniors who are good at service, and copy them. Copying is the fastest way to improve.",
      zh:"观察服务做得好的前辈的用词、站位和时机，然后模仿。模仿是最快的进步方法。",
      vi:"Quan sát lời nói, vị trí đứng, thời điểm của người đi trước phục vụ giỏi và bắt chước. Bắt chước là cách tiến bộ nhanh nhất."}},
  {h:{ja:"自分が楽しむ",en:"Enjoy it yourself",zh:"自己也要享受",vi:"Bản thân cũng phải vui"},
   p:{ja:"スタッフが楽しそうに働く店は、お客様も楽しい。笑顔は作るものではなく、自分が楽しんでいると自然に出るもの。",
      en:"A shop where staff look like they're having fun is fun for guests too. A smile isn't forced; it comes naturally when you enjoy what you do.",
      zh:"员工工作得开心的店，客人也会开心。笑容不是装出来的，而是自己享受时自然流露的。",
      vi:"Quán mà nhân viên làm việc vui vẻ thì khách cũng vui. Nụ cười không phải gượng ép, mà tự nhiên có khi bạn tận hưởng công việc."}}
 ]
}
];

/* ---------- はじめに（研修初日に見せながら説明するページ） ---------- */
const INTRO = [
 {h:{ja:"ようこそ",en:"Welcome",zh:"欢迎",vi:"Chào mừng"},
  p:{ja:"今日からホールスタッフとしての研修が始まります。最初から完璧にできる人はいません。このアプリは、あなたが自信を持って接客できるようになるまで、毎日少しずつ一緒に進むためのものです。分からないことは、いつでも研修担当に聞いてください。",
     en:"Today your training as floor staff begins. Nobody is perfect from the start. This app helps you move forward little by little each day until you can serve guests with confidence. Ask your trainer anytime when you don't understand something.",
     zh:"从今天开始，你将作为大厅员工开始培训。没有人一开始就能做到完美。这个应用会陪你每天一点点前进，直到能自信地接待客人。有不懂的随时问培训负责人。",
     vi:"Hôm nay bắt đầu khóa đào tạo nhân viên sảnh của bạn. Không ai hoàn hảo ngay từ đầu. Ứng dụng này giúp bạn tiến từng chút mỗi ngày cho đến khi tự tin phục vụ khách. Có gì chưa hiểu, hãy hỏi người phụ trách đào tạo bất cứ lúc nào."}},
 {h:{ja:"この研修のゴール",en:"The goal of this training",zh:"本次培训的目标",vi:"Mục tiêu của khóa đào tạo"},
  p:{ja:"ゴールは「お客様に『また来たい』と思ってもらえるホールスタッフ」になること。そのために、①良い接客とは何かを知り、②毎日の行動にして、③振り返って伸ばす。この3つをくり返します。",
     en:"The goal is to become floor staff who make guests think \"I want to come back.\" To get there we repeat three things: 1) learn what good service is, 2) turn it into daily actions, 3) reflect and improve.",
     zh:"目标是成为让客人“还想再来”的大厅员工。为此我们反复做三件事：①了解什么是好的服务，②变成每天的行动，③回顾并提高。",
     vi:"Mục tiêu là trở thành nhân viên sảnh khiến khách nghĩ \"muốn quay lại\". Để đạt được, chúng ta lặp lại 3 việc: ① hiểu phục vụ tốt là gì, ② biến thành hành động mỗi ngày, ③ nhìn lại và cải thiện."}},
 {flow:true, h:{ja:"研修の流れ（4ステップ）",en:"Training flow (4 steps)",zh:"培训流程（4个步骤）",vi:"Lộ trình đào tạo (4 bước)"},
  p:{ja:"STEP1 知る：マインドと商品を学び、確認テストに合格する。\nSTEP2 できる：毎日の行動チェックで基本を身につける。\nSTEP3 提案する：お客様に合わせて商品をすすめられるようになる。\nSTEP4 任せられる：フロア全体を見て動き、後輩に教えられる。\n各ステップの期間は、あなたの研修期間に合わせて決まります。研修担当が確認して進みます。",
     en:"STEP 1 Learn: study the mindset and products, pass the check test.\nSTEP 2 Do: build the basics with the daily action check.\nSTEP 3 Suggest: recommend items to match each guest.\nSTEP 4 Trusted: see the whole floor, act, and teach newer staff.\nThe length of each step is set from your training period. Your trainer confirms each step.",
     zh:"第1步 了解：学习心态和商品，通过确认测试。\n第2步 做到：通过每天的行动检查掌握基础。\n第3步 推荐：能根据客人推荐商品。\n第4步 可以托付：看全场行动，能教后辈。\n各步骤的时间根据你的培训期间决定，由培训负责人确认后前进。",
     vi:"BƯỚC 1 Hiểu: học tâm thế và món ăn, vượt qua bài kiểm tra.\nBƯỚC 2 Làm được: nắm cơ bản qua kiểm tra hành động hằng ngày.\nBƯỚC 3 Gợi ý: gợi ý món phù hợp từng khách.\nBƯỚC 4 Được giao phó: nhìn cả sảnh, hành động và dạy người mới.\nThời gian mỗi bước được tính theo thời gian đào tạo của bạn. Người phụ trách xác nhận từng bước."}},
 {h:{ja:"1日の使い方",en:"How to use it each day",zh:"每天的用法",vi:"Cách dùng mỗi ngày"},
  p:{ja:"出勤したら（1分）：ホームで「今日のひと言」と、前日に決めた「今日いちばん意識すること」を読む。\n営業中：決めたことを1つだけ意識して動く。\n退勤前（3分）：「チェック」で今日の行動に○△×をつけ、振り返りを書く。気づいたことは「気づきメモ」へ。\n週に1回：「報告」から研修担当へ送る。",
     en:"When you arrive (1 min): on Home, read \"Today's word\" and the one thing you decided to focus on.\nDuring service: focus on that one thing.\nBefore leaving (3 min): in Check, mark today's actions ○△× and write your reflection. Put anything you noticed in Notes.\nOnce a week: send a report to your trainer from Report.",
     zh:"上班后（1分钟）：在首页读“今日一句”和前一天定下的“今天最要注意的事”。\n营业中：只专注于定下的那一件事。\n下班前（3分钟）：在“检查”里给今天的行动打○△×，写回顾。察觉到的写进“察觉笔记”。\n每周一次：从“报告”发给培训负责人。",
     vi:"Khi đến ca (1 phút): ở Trang chủ, đọc \"Câu nói hôm nay\" và điều bạn đã chọn để chú ý.\nTrong giờ làm: chú ý vào đúng một điều đó.\nTrước khi về (3 phút): ở mục Kiểm tra, đánh dấu ○△× cho hành động hôm nay và viết nhìn lại. Điều nhận ra ghi vào Ghi chú.\nMỗi tuần một lần: gửi báo cáo cho người phụ trách từ mục Báo cáo."}},
 {h:{ja:"最初に覚える基本の言葉",en:"Basic phrases to learn first",zh:"首先要记住的基本用语",vi:"Những câu cơ bản cần nhớ trước"},
  p:{ja:"いらっしゃいませ／かしこまりました／少々お待ちくださいませ／お待たせいたしました／失礼いたします／申し訳ございません／ありがとうございました、またお待ちしております",
     en:"Irasshaimase (Welcome) / Kashikomarimashita (Certainly) / Shoshō omachi kudasaimase (One moment please) / Omatase itashimashita (Thank you for waiting) / Shitsurei itashimasu (Excuse me) / Mōshiwake gozaimasen (I'm very sorry) / Arigatō gozaimashita, mata omachi shite orimasu (Thank you, we look forward to seeing you again)",
     zh:"いらっしゃいませ（欢迎光临）／かしこまりました（好的，明白了）／少々お待ちくださいませ（请稍等）／お待たせいたしました（让您久等了）／失礼いたします（打扰了）／申し訳ございません（非常抱歉）／ありがとうございました、またお待ちしております（谢谢，期待您再次光临）",
     vi:"Irasshaimase (Xin mời vào) / Kashikomarimashita (Vâng ạ) / Shoshō omachi kudasaimase (Xin chờ một chút) / Omatase itashimashita (Xin lỗi đã để chờ) / Shitsurei itashimasu (Xin phép) / Mōshiwake gozaimasen (Thành thật xin lỗi) / Arigatō gozaimashita, mata omachi shite orimasu (Cảm ơn, mong quý khách quay lại)"}},
 {h:{ja:"約束ごと",en:"Our promises",zh:"约定",vi:"Những điều cam kết"},
  p:{ja:"身だしなみは出勤前に鏡で確認する／挨拶は自分から、相手に届く声で／報告・連絡・相談は早めに（特にミスやトラブルはすぐ）／分からないことはそのままにしない／お客様の前で私語・スマホ操作をしない",
     en:"Check your appearance in the mirror before your shift / Greet first, loud enough to be heard / Report, update and consult early (especially mistakes and trouble, immediately) / Don't leave things you don't understand / No private chat or phone use in front of guests",
     zh:"上班前照镜子检查仪容／主动打招呼，声音要让对方听到／尽早报告、联络、商量（尤其是失误和问题要马上说）／不懂的事不要放着不管／在客人面前不闲聊、不玩手机",
     vi:"Kiểm tra ngoại hình trước gương trước ca / Chủ động chào, đủ lớn để người khác nghe / Báo cáo, liên lạc, hỏi ý kiến sớm (đặc biệt sai sót và sự cố thì báo ngay) / Không để điều chưa hiểu trôi qua / Không nói chuyện riêng, không dùng điện thoại trước mặt khách"}},
 {h:{ja:"困ったときは",en:"When you're in trouble",zh:"遇到困难时",vi:"Khi gặp khó khăn"},
  p:{ja:"ひとりで抱えないこと。お客様には「確認してまいります」と伝え、すぐに社員・リーダー・研修担当に相談してください。相談できることも、大事な力です。",
     en:"Don't handle it alone. Tell the guest \"Let me check for you,\" then talk to a manager, leader or your trainer right away. Being able to ask for help is an important skill too.",
     zh:"不要一个人扛着。告诉客人“我去确认一下”，然后马上找正式员工、领班或培训负责人商量。能够求助，也是重要的能力。",
     vi:"Đừng ôm một mình. Nói với khách \"Để em kiểm tra ạ\", rồi hỏi ngay quản lý, trưởng ca hoặc người phụ trách đào tạo. Biết nhờ giúp đỡ cũng là một năng lực quan trọng."}},
 {h:{ja:"今日やること",en:"What to do today",zh:"今天要做的事",vi:"Việc cần làm hôm nay"},
  p:{ja:"①名前・研修担当・研修期間を登録する ②このアプリをホーム画面に追加する（設定 → ホーム画面に追加する方法）③マインドの「良い接客ってそもそも何？」「なぜホールを重要視するのか」を読む ④マンダラの中心に、自分の言葉で「なりたいホールスタッフ像」を書く",
     en:"1) Register your name, trainer and training period 2) Add this app to your home screen (Settings → How to add to home screen) 3) Read \"What is good service, really?\" and \"Why we value the floor\" in Mindset 4) In the center of the mandala, write the floor staff you want to become, in your own words",
     zh:"①登记姓名、培训负责人和培训期间 ②把应用添加到主屏幕（设置 → 添加到主屏幕的方法）③阅读心态中的“什么才是好的服务？”和“为什么我们重视大厅服务” ④在曼陀罗中心用自己的话写下“想成为的大厅员工”",
     vi:"① Đăng ký tên, người phụ trách và thời gian đào tạo ② Thêm ứng dụng vào màn hình chính (Cài đặt → Cách thêm vào màn hình chính) ③ Đọc \"Phục vụ tốt thực ra là gì?\" và \"Vì sao coi trọng phục vụ sảnh\" trong Tâm thế ④ Viết vào giữa mandala hình ảnh nhân viên sảnh bạn muốn trở thành, bằng lời của mình"}}
