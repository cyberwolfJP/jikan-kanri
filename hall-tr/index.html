{ id:"a1",
  title:{ja:"注文は「お客様の言葉のまま」復唱する",en:"Repeat the order back in the guest's own words",zh:"用客人的原话复述点单",vi:"Nhắc lại order bằng đúng lời của khách"},
  act:{ja:"「生ひとつと、唐揚げですね」のように、お客様が言った言葉をそのまま繰り返す。「かしこまりました」「すぐお持ちします」だけで終わらせない。",
       en:"Repeat exactly what the guest said, e.g. \"One draft beer and the karaage.\" Don't end with just \"Certainly\" or \"Coming right up\".",
       zh:"像“一杯生啤和炸鸡，对吧”这样，把客人说的话原样重复。不要只说“好的”“马上就来”就结束。",
       vi:"Nhắc lại đúng lời khách nói, ví dụ \"Một bia tươi và gà karaage ạ.\" Đừng chỉ nói \"Vâng ạ\" hay \"Có ngay ạ\" rồi thôi."},
  why:{ja:"オランダのレストランでの実験（van Baaren ほか 2003）では、ウェイトレスが注文を一字一句そのまま繰り返した客のほうが、繰り返さなかった客よりチップが有意に多くなりました。相手の言葉をまねると「わかってもらえた」という好意が生まれると考えられています。復唱は注文間違いも減らせます。",
       en:"In a Dutch restaurant experiment (van Baaren et al., 2003), a waitress received significantly larger tips from guests whose orders she repeated word for word than from guests whose orders she didn't. Mimicking someone's words is thought to create a feeling of being understood. Repeating back also reduces order mistakes.",
       zh:"在荷兰餐厅的实验中（van Baaren 等，2003），女服务员逐字复述点单的客人，比没有复述的客人给的小费明显更多。一般认为模仿对方的话会让人产生“被理解了”的好感。复述也能减少点错单。",
       vi:"Trong thí nghiệm tại nhà hàng ở Hà Lan (van Baaren và cộng sự, 2003), cô phục vụ nhận tiền tip nhiều hơn rõ rệt từ những khách được cô nhắc lại order đúng từng chữ. Bắt chước lời người khác được cho là tạo cảm giác \"được thấu hiểu\". Nhắc lại còn giảm nhầm order."},
  care:{ja:"実験は少人数のスタッフで行われたものです。オウム返しをしすぎると不自然なので、注文の確認のときだけで十分です。",
        en:"The study involved few servers. Overdoing the parroting feels unnatural; doing it when confirming orders is enough.",
        zh:"实验涉及的服务员人数很少。过度鹦鹉学舌会不自然，只在确认点单时做就够了。",
        vi:"Nghiên cứu chỉ có ít nhân viên tham gia. Lặp lại quá nhiều sẽ thiếu tự nhiên; chỉ cần làm khi xác nhận order."},
  src:["van Baaren, R. B., Holland, R. W., Steenaert, B., & van Knippenberg, A. (2003). Mimicry for money: Behavioral consequences of imitation. Journal of Experimental Social Psychology, 39(4), 393–398."]},
{ id:"a2",
  title:{ja:"最初の30秒：名乗る・目線を下げる",en:"The first 30 seconds: introduce yourself, lower your eye level",zh:"最初30秒：报上名字、降低视线",vi:"30 giây đầu: giới thiệu tên, hạ tầm mắt"},
  act:{ja:"初めての卓には「本日担当します〇〇です」と名乗る。注文を取るとき、立ったまま見下ろさず、腰を落としてお客様と目線の高さをそろえる。",
       en:"At a new table, say \"I'm ○○ and I'll be looking after you today.\" When taking orders, don't look down from above; lower yourself to the guest's eye level.",
       zh:"对第一次接待的桌，说“今天由我〇〇为您服务”。点单时不要站着俯视，蹲低一些，和客人视线保持同一高度。",
       vi:"Ở bàn mới, nói \"Hôm nay em là ○○, em sẽ phục vụ quý khách.\" Khi nhận order, đừng đứng nhìn xuống; hạ người xuống ngang tầm mắt khách."},
  why:{ja:"ブランチでの実験（Garrity & Degelman 1990、2人客42組）では、スタッフが名前を名乗った卓のチップ率は23.4%、名乗らなかった卓は15.0%でした。別の実験（Lynn & Mynier 1993）では、最初の接客でしゃがんで目線を下げた卓のチップ率は17.5%、立ったままの卓は14.9%でした。",
       en:"In a brunch experiment (Garrity & Degelman, 1990; 42 two-person parties), tables where the server introduced herself by name tipped 23.4% vs 15.0% without. In another (Lynn & Mynier, 1993), tables where the server squatted at the first visit tipped 17.5% vs 14.9% standing.",
       zh:"在早午餐实验中（Garrity & Degelman，1990，42组两人客），服务员报上名字的桌小费率为23.4%，不报名字的为15.0%。另一项实验（Lynn & Mynier，1993）中，第一次接待时蹲下降低视线的桌小费率为17.5%，站着的为14.9%。",
       vi:"Trong thí nghiệm bữa brunch (Garrity & Degelman, 1990; 42 nhóm 2 người), bàn được nhân viên giới thiệu tên cho tip 23,4%, không giới thiệu là 15,0%. Một thí nghiệm khác (Lynn & Mynier, 1993): bàn mà nhân viên ngồi xuống ngang tầm mắt ở lần đầu cho tip 17,5%, đứng là 14,9%."},
  care:{ja:"どちらもアメリカの小規模な実験で、スタッフは1〜2人です。高級店では、しゃがむ接客がくだけすぎに見えることがあります。店のスタイルに合わせて、膝をつく・少しかがむなどで調整してください。",
        en:"Both are small US studies with one or two servers. In upscale settings squatting may look too casual; adjust to your shop's style (kneeling, a slight bow, etc.).",
        zh:"两者都是美国的小规模实验，服务员只有1～2人。在高级店，蹲着服务可能显得太随意，请根据店的风格调整（单膝跪、稍微弯腰等）。",
        vi:"Cả hai đều là nghiên cứu nhỏ ở Mỹ với 1–2 nhân viên. Ở quán sang trọng, ngồi xổm có thể trông quá suồng sã; hãy điều chỉnh theo phong cách quán (quỳ một gối, cúi nhẹ…)."},
  src:["Garrity, K., & Degelman, D. (1990). Effect of server introduction on restaurant tipping. Journal of Applied Social Psychology, 20(2), 168–172.","Lynn, M., & Mynier, K. (1993). Effect of server posture on restaurant tipping. Journal of Applied Social Psychology, 23(8), 678–685."]},
{ id:"a3",
  title:{ja:"返報性：先に「小さなうれしい」を渡す",en:"Reciprocity: give a small pleasant surprise first",zh:"互惠：先给一个“小惊喜”",vi:"Có qua có lại: trao một niềm vui nhỏ trước"},
  act:{ja:"お会計のときに心を込めて「ありがとうございました」を伝える。お客様の役に立つ情報（空いている時間帯、次に来たとき試してほしい一品など）をひと言そえる。店で決まったサービス品があれば、事務的に置かず、一人ひとりに手渡す。",
       en:"Say \"Thank you very much\" sincerely at checkout. Add a useful tip (quiet hours, a dish to try next time). If the shop has an approved small treat, hand it to each guest personally rather than just leaving it.",
       zh:"结账时真诚地说“非常感谢”。附上一句对客人有用的信息（人少的时段、下次想推荐的菜等）。如果店里有规定的小赠品，不要随手放下，而是逐一递给客人。",
       vi:"Khi thanh toán, chân thành nói \"Cảm ơn quý khách rất nhiều\". Thêm một thông tin có ích (giờ vắng, món nên thử lần sau). Nếu quán có quà nhỏ được phép tặng, hãy trao tận tay từng người thay vì đặt xuống."},
  why:{ja:"会計時にチョコを渡した実験（Strohmetz ほか 2002）では、渡さなかった場合よりチップが増えました。量を増やすほど、また1個渡した後に「もう1つどうぞ」と特別感を出したほうが、さらに増えました。会計票に「Thank you」と書く（Rind & Bordia 1995）、次回の特別メニューの案内を書く（Rind & Strohmetz 1999、約17%→20%）でも効果がありました。人は何かをもらうと、お返しをしたくなります（返報性）。",
       en:"In an experiment giving chocolate with the bill (Strohmetz et al., 2002), tips rose compared with no candy; more candy raised them further, and giving one piece then turning back to offer \"one more for you\" raised them most. Writing \"Thank you\" on the check (Rind & Bordia, 1995) and a helpful note about an upcoming special (Rind & Strohmetz, 1999; about 17%→20%) also worked. People want to return a favor (reciprocity).",
       zh:"在结账时送巧克力的实验中（Strohmetz 等，2002），小费比不送时增加。送得越多越高；而先给一块、转身再说“再送您一块”营造特别感时最高。在账单上写“Thank you”（Rind & Bordia，1995）、写下次特别菜单的介绍（Rind & Strohmetz，1999，约17%→20%）也有效果。人收到东西后会想回报（互惠）。",
       vi:"Trong thí nghiệm tặng sô-cô-la kèm hóa đơn (Strohmetz và cộng sự, 2002), tiền tip tăng so với không tặng; tặng nhiều hơn thì tăng thêm, và đưa một viên rồi quay lại nói \"tặng thêm một viên\" thì tăng nhiều nhất. Viết \"Thank you\" lên hóa đơn (Rind & Bordia, 1995) và ghi thông tin món đặc biệt sắp tới (Rind & Strohmetz, 1999; khoảng 17%→20%) cũng có hiệu quả. Nhận được gì đó, người ta muốn đáp lại (tính có qua có lại)."},
  care:{ja:"サービス品は必ず店のルールの範囲で。自分の判断で無料の品を出すのはダメです。日本では、お金のかからない「感謝のことば」と「役立つ情報」を中心にしましょう。",
        en:"Treats only within shop rules; never give free items on your own. In Japan, focus on free things: words of thanks and useful information.",
        zh:"赠品一定要在店规范围内，不能自作主张免费送东西。在日本，以不花钱的“感谢的话”和“有用的信息”为主。",
        vi:"Quà tặng chỉ trong phạm vi quy định của quán; tuyệt đối không tự ý tặng miễn phí. Ở Nhật, hãy tập trung vào những thứ không tốn tiền: lời cảm ơn và thông tin có ích."},
  src:["Strohmetz, D. B., Rind, B., Fisher, R., & Lynn, M. (2002). Sweetening the till: The use of candy to increase restaurant tipping. Journal of Applied Social Psychology, 32(2), 300–309.","Rind, B., & Bordia, P. (1995). Effect of server's \"thank you\" and personalization on restaurant tipping. Journal of Applied Social Psychology, 25(9), 745–751.","Rind, B., & Strohmetz, D. (1999). Effect on restaurant tipping of a helpful message written on the back of customers' checks. Journal of Applied Social Psychology, 29(1), 139–144."]},
{ id:"a4",
  title:{ja:"笑顔は「量」より「本物かどうか」",en:"Smiles: authenticity beats quantity",zh:"笑容：重要的不是“多少”，而是“真不真”",vi:"Nụ cười: thật lòng quan trọng hơn nhiều hay ít"},
  act:{ja:"顔だけ笑うのではなく、気持ちから整える。「来てくれてありがとう」と本当に思えることを1つ見つけてから卓に行く。疲れているときほど、ひと呼吸おいてから接客する。",
       en:"Don't just smile with your face; prepare your feelings. Find one thing you're genuinely thankful for before going to a table. The more tired you are, the more you should take a breath first.",
       zh:"不只是脸在笑，而是先调整心情。去桌边前，先找到一件真心觉得“谢谢您来”的事。越累越要先深呼吸再接待。",
       vi:"Đừng chỉ cười bằng gương mặt; hãy chuẩn bị từ cảm xúc. Trước khi đến bàn, tìm một điều bạn thật lòng biết ơn. Càng mệt càng nên hít một hơi trước khi phục vụ."},
  why:{ja:"223人が参加した実験（Hennig-Thurau ほか 2006）では、お客様の気分を左右したのは、笑顔の量ではなく、気持ちのこもった「本物らしさ」でした。笑顔を増やしただけでは、お客様の感情は変わりませんでした。銀行窓口の研究（Pugh 2001）でも、スタッフが表すポジティブな感情がお客様の気分と評価に結びついていました。",
       en:"In an experiment with 223 participants (Hennig-Thurau et al., 2006), what changed guests' mood was not the amount of smiling but its authenticity; simply smiling more did not change customer emotions. A bank-teller study (Pugh, 2001) also linked employees' displayed positive emotion to customers' mood and evaluations.",
       zh:"在223人参与的实验中（Hennig-Thurau 等，2006），影响客人心情的不是笑容的多少，而是发自内心的“真实感”；只是笑得更多并不能改变客人的情绪。银行柜台的研究（Pugh，2001）也显示，员工表现出的积极情绪与客人的心情和评价相关。",
       vi:"Trong thí nghiệm với 223 người (Hennig-Thurau và cộng sự, 2006), điều thay đổi tâm trạng khách không phải là cười nhiều hay ít mà là sự chân thật; chỉ cười nhiều hơn không làm thay đổi cảm xúc của khách. Nghiên cứu ở quầy ngân hàng (Pugh, 2001) cũng cho thấy cảm xúc tích cực nhân viên thể hiện liên quan đến tâm trạng và đánh giá của khách."},
  care:{ja:"2006年の研究は、役者がスタッフを演じた模擬の場面で行われました。無理に明るくし続けると本人が疲れるので、休憩や交代も大事です。",
        en:"The 2006 study used a simulated encounter with actors as staff. Forcing cheerfulness all day exhausts you, so breaks and rotation matter too.",
        zh:"2006年的研究是由演员扮演员工的模拟场景。一直勉强保持开朗会让自己疲惫，休息和换班也很重要。",
        vi:"Nghiên cứu 2006 dùng tình huống mô phỏng với diễn viên đóng vai nhân viên. Gượng vui cả ngày sẽ kiệt sức, nên nghỉ ngơi và luân phiên cũng quan trọng."},
  src:["Hennig-Thurau, T., Groth, M., Paul, M., & Gremler, D. D. (2006). Are all smiles created equal? How emotional contagion and emotional labor affect service relationships. Journal of Marketing, 70(3), 58–73.","Pugh, S. D. (2001). Service with a smile: Emotional contagion in the service encounter. Academy of Management Journal, 44(5), 1018–1027."]},
{ id:"a5",
  title:{ja:"「人気」は事実で伝えると選ばれる",en:"\"Popular\" works when it's a fact",zh:"用事实说“人气”，客人就会选",vi:"\"Được ưa chuộng\" hiệu quả khi là sự thật"},
  act:{ja:"迷っているお客様には「先週いちばん出たのはこちらです」のように、実際の注文数にもとづく人気を伝える。初めてのお客様には特に効果的。",
       en:"To undecided guests, share popularity based on real orders: \"This was our best seller last week.\" Especially effective for first-time guests.",
       zh:"对犹豫的客人，根据实际点单数介绍人气，比如“上周点得最多的是这道”。对第一次来的客人尤其有效。",
       vi:"Với khách đang phân vân, nói về độ phổ biến dựa trên số order thật: \"Tuần trước món này bán chạy nhất ạ.\" Đặc biệt hiệu quả với khách lần đầu."},
  why:{ja:"北京のレストランでの無作為化実験（Cai, Chen & Fang 2009）では、人気上位5品のランキングを見せた卓で、その5品の注文が13〜20%増えました。人気と書かずに料理名を並べただけでは増えませんでした。効果は来店回数の少ないお客様ほど強く、ランキングを見せた卓では食事の満足度も上がりました。",
       en:"In a randomized field experiment at a Beijing restaurant (Cai, Chen & Fang, 2009), showing a ranking of the top-5 dishes increased demand for them by 13–20%, while simply listing dish names without \"popular\" did not. The effect was stronger for infrequent guests, and dining satisfaction rose when the ranking was shown.",
       zh:"在北京餐厅的随机实验中（Cai、Chen & Fang，2009），展示人气前五名排行的桌，这五道菜的点单增加了13～20%；只列菜名、不说人气则没有增加。来店次数少的客人效果更强，看到排行的桌用餐满意度也提高了。",
       vi:"Trong thí nghiệm ngẫu nhiên tại nhà hàng ở Bắc Kinh (Cai, Chen & Fang, 2009), bàn được xem bảng xếp hạng 5 món bán chạy nhất gọi 5 món đó nhiều hơn 13–20%; chỉ liệt kê tên món mà không nói \"bán chạy\" thì không tăng. Hiệu quả mạnh hơn với khách ít đến, và mức hài lòng cũng tăng khi được xem bảng xếp hạng."},
  care:{ja:"必ず本当の注文数にもとづくこと。根拠のない「人気No.1」は景品表示法の問題になりえます（上の「大前提」を参照）。",
        en:"Always base it on real order counts. Unfounded \"No.1\" claims can be a legal problem (see \"Ground rule\").",
        zh:"一定要基于真实的点单数。没有根据的“人气第一”可能违反景品表示法（参见上面的“大前提”）。",
        vi:"Luôn dựa trên số order thật. Khẳng định \"No.1\" thiếu căn cứ có thể vi phạm luật (xem \"Nguyên tắc\")."},
  src:["Cai, H., Chen, Y., & Fang, H. (2009). Observational learning: Evidence from a randomized natural field experiment. American Economic Review, 99(3), 864–882."]},
{ id:"a6",
  title:{ja:"迷っている人には「2〜3択」で",en:"For undecided guests, offer 2–3 options",zh:"对犹豫的客人给“2～3个选项”",vi:"Khách phân vân: đưa 2–3 lựa chọn"},
  act:{ja:"メニューを見て迷っているお客様には「さっぱりならA、がっつりならBです」と2〜3品にしぼって提案する。決めているお客様には口をはさまない。",
       en:"For guests struggling with the menu, narrow it down: \"If you want something light, A; something hearty, B.\" Don't interrupt guests who have already decided.",
       zh:"对看着菜单犹豫的客人，缩小到2～3道推荐：“想清淡就选A，想吃得饱就选B”。已经决定好的客人不要插嘴。",
       vi:"Với khách đang lúng túng trước thực đơn, thu hẹp lại: \"Muốn nhẹ thì món A, muốn no thì món B ạ.\" Đừng chen vào khi khách đã quyết định."},
  why:{ja:"「選択肢が多すぎると選べなくなる」という説は有名ですが、50の実験をまとめた分析（Scheibehenne ほか 2010）では、平均の効果はほぼゼロでした。ただし研究によって結果のばらつきが大きく、好みがはっきりしていない人ほど選択肢の多さに困りやすい傾向も示されています。だから「全員にしぼる」のではなく「迷っている人にだけしぼる」のが正確な使い方です。",
       en:"The idea that \"too many choices paralyze people\" is famous, but a meta-analysis of 50 experiments (Scheibehenne et al., 2010) found an average effect of virtually zero, with large variation between studies; people without clear preferences tended to be more troubled by many options. So narrow options only for guests who are unsure, not for everyone.",
       zh:"“选项太多就选不出来”的说法很有名，但汇总50项实验的元分析（Scheibehenne 等，2010）发现平均效果几乎为零，不过各研究结果差异很大；偏好不明确的人更容易被太多选项困扰。所以正确用法不是“对所有人缩小选项”，而是“只对犹豫的人缩小”。",
       vi:"Ý kiến \"quá nhiều lựa chọn làm người ta không chọn được\" rất nổi tiếng, nhưng phân tích tổng hợp 50 thí nghiệm (Scheibehenne và cộng sự, 2010) cho thấy hiệu quả trung bình gần như bằng 0, dù kết quả giữa các nghiên cứu khác nhau nhiều; người chưa có sở thích rõ ràng dễ bối rối hơn. Vì vậy chỉ thu hẹp lựa chọn cho khách đang phân vân, không phải cho mọi người."},
  care:{ja:"「ジャムの実験」などの有名な話は、追試で再現されないこともあります。ネットの「心理術」はうのみにしないこと。",
        en:"Famous stories like the \"jam study\" have not always replicated. Don't take online \"psychology tricks\" at face value.",
        zh:"像“果酱实验”这样有名的故事，重复实验时并不总能再现。不要轻信网上的“心理技巧”。",
        vi:"Những câu chuyện nổi tiếng như \"thí nghiệm mứt\" không phải lúc nào cũng lặp lại được. Đừng tin ngay các \"mẹo tâm lý\" trên mạng."},
  src:["Scheibehenne, B., Greifeneder, R., & Todd, P. M. (2010). Can there ever be too many options? A meta-analytic review of choice overload. Journal of Consumer Research, 37(3), 409–425."]},
{ id:"a7",
  title:{ja:"待ち時間は「長さ」より「感じ方」",en:"Waiting: perception matters more than length",zh:"等待：比起“长短”，更重要的是“感受”",vi:"Chờ đợi: cảm nhận quan trọng hơn độ dài"},
  act:{ja:"遅れそうなら先に「あと10分ほどでお持ちします」と目安を伝える。理由も短く伝える（「一品ずつ焼き上げています」）。待つ間はメニューや飲み物で手持ちぶさたにしない。入店直後にすぐ声をかけ、「気づいてもらえた」と感じてもらう。",
       en:"If something will be late, tell guests in advance: \"About 10 more minutes.\" Give a short reason (\"We grill each one to order\"). Keep them occupied with the menu or drinks. Greet them right after they enter so they feel noticed.",
       zh:"可能会晚的话，先告知大概时间：“大约还要10分钟”。简短说明理由（“我们是一份一份现烤的”）。等待时用菜单或饮料让客人不无聊。客人一进门就马上打招呼，让对方觉得“被注意到了”。",
       vi:"Nếu món có thể ra chậm, báo trước: \"Khoảng 10 phút nữa ạ.\" Nói ngắn lý do (\"Quán nướng từng phần theo order\"). Để khách có thực đơn hay đồ uống trong lúc chờ. Chào ngay khi khách vào để họ thấy \"được chú ý\"."},
  why:{ja:"待ち時間の心理をまとめたMaister（1985）は、「何もしていない時間は長く感じる」「始まる前の待ちは長く感じる」「先が見えない待ちは長く感じる」「理由のわからない待ちは長く感じる」「不公平な待ちは長く感じる」などの原則を示しました。同じ待ち時間でも、伝え方しだいで不満は小さくできます。",
       en:"Maister (1985) summarized the psychology of waiting: unoccupied time feels longer, pre-process waits feel longer, uncertain waits feel longer, unexplained waits feel longer, unfair waits feel longer. The same wait can cause less frustration depending on how you communicate.",
       zh:"Maister（1985）总结了等待的心理：无所事事的时间感觉更长、开始前的等待感觉更长、不知何时结束的等待感觉更长、不知道原因的等待感觉更长、不公平的等待感觉更长。同样的等待时间，说明方式不同，不满就能变小。",
       vi:"Maister (1985) tóm tắt tâm lý chờ đợi: thời gian không có gì làm thấy dài hơn, chờ trước khi bắt đầu thấy dài hơn, chờ không biết bao lâu thấy dài hơn, chờ không rõ lý do thấy dài hơn, chờ bất công thấy dài hơn. Cùng thời gian chờ, cách nói khác nhau sẽ giảm bớt bực bội."},
  care:{ja:"これは実験結果というより、サービスの研究者がまとめた原則です。目安の時間は少し長めに伝え、約束より早く出すほうが安全です。",
        en:"These are principles compiled by a service researcher rather than results of one experiment. It's safer to quote a slightly longer time and deliver early.",
        zh:"这些与其说是实验结果，不如说是服务研究者总结的原则。告知的时间稍微说长一点，比约定更早上菜更稳妥。",
        vi:"Đây là các nguyên tắc do nhà nghiên cứu dịch vụ tổng hợp, không phải kết quả một thí nghiệm. Báo thời gian dài hơn một chút và mang ra sớm hơn sẽ an toàn hơn."},
  src:["Maister, D. H. (1985). The psychology of waiting lines. In J. A. Czepiel, M. R. Solomon, & C. F. Surprenant (Eds.), The Service Encounter. Lexington Books."]},
{ id:"a8",
  title:{ja:"思い出は「いちばんの瞬間」と「最後」で決まる",en:"Memories are shaped by the best moment and the end",zh:"回忆由“最精彩的瞬间”和“最后”决定",vi:"Ký ức được quyết định bởi khoảnh khắc đỉnh và phút cuối"},
  act:{ja:"来店中に「いちばんうれしい瞬間」を1つ作る（熱々の提供、覚えていてくれた一言など）。そして最後を丁寧にする。会計を待たせない、出口の方を向いて「またお待ちしております」と見送る。",
       en:"Create one \"best moment\" during the visit (piping-hot food, a remembered preference). Then make the ending careful: no wait at checkout, face the exit and say \"We look forward to seeing you again\".",
       zh:"在用餐中创造一个“最开心的瞬间”（热腾腾地上菜、记得客人喜好的一句话等）。然后把最后做细致：结账不让客人等，面向出口说“期待您再次光临”送客。",
       vi:"Tạo một \"khoảnh khắc vui nhất\" trong lúc khách ở quán (món nóng hổi, một câu cho thấy bạn nhớ sở thích của khách). Rồi làm phút cuối thật chu đáo: không để khách chờ thanh toán, quay về phía cửa và nói \"Mong quý khách quay lại\"."},
  why:{ja:"人は体験全体を平均して覚えるのではなく、最も強い瞬間（ピーク）と終わり（エンド）で評価しがちです（ピーク・エンドの法則、Kahneman ほか 1993）。大腸内視鏡検査の無作為化試験（Redelmeier, Katz & Kahneman 2003、682人）では、終わりを穏やかにしたグループのほうが、検査全体の記憶がよくなりました。",
       en:"People tend to judge an experience by its most intense moment and its end rather than its average (peak-end rule; Kahneman et al., 1993). In a randomized colonoscopy trial (Redelmeier, Katz & Kahneman, 2003; 682 patients), giving the procedure a gentler ending improved patients' memories of it.",
       zh:"人往往不是用平均值记住整个体验，而是用最强烈的瞬间（峰值）和结尾来评价（峰终定律，Kahneman 等，1993）。在肠镜检查的随机试验中（Redelmeier、Katz & Kahneman，2003，682人），让结尾更温和的一组，对整个检查的记忆更好。",
       vi:"Con người thường đánh giá trải nghiệm bằng khoảnh khắc mạnh nhất và phần kết, không phải trung bình (quy luật đỉnh–kết; Kahneman và cộng sự, 1993). Trong thử nghiệm ngẫu nhiên về nội soi đại tràng (Redelmeier, Katz & Kahneman, 2003; 682 bệnh nhân), nhóm có phần kết nhẹ nhàng hơn nhớ về cả quá trình tốt hơn."},
  care:{ja:"2022年の大規模なメタ分析では、ピーク・エンドの効果は確認された一方で、体験全体の平均も同じくらい評価を左右していました。「最後だけ良ければいい」ではなく、途中の質も同じくらい大事です。",
        en:"A large 2022 meta-analysis confirmed peak-end effects but found the average of the whole experience predicted evaluations just as well. It's not \"only the ending matters\"; quality throughout matters just as much.",
        zh:"2022年的大规模元分析确认了峰终效应，但同时发现整个体验的平均值对评价的影响同样大。不是“只要结尾好就行”，过程中的质量同样重要。",
        vi:"Phân tích tổng hợp lớn năm 2022 xác nhận hiệu ứng đỉnh–kết nhưng cũng thấy trung bình toàn bộ trải nghiệm ảnh hưởng đến đánh giá tương đương. Không phải \"chỉ cần kết tốt\"; chất lượng suốt quá trình cũng quan trọng như vậy."},
  src:["Kahneman, D., Fredrickson, B. L., Schreiber, C. A., & Redelmeier, D. A. (1993). When more pain is preferred to less: Adding a better end. Psychological Science, 4(6), 401–405.","Redelmeier, D. A., Katz, J., & Kahneman, D. (2003). Memories of colonoscopy: A randomized trial. Pain, 104(1–2), 187–194.","Alaybek, B., et al. (2022). ピーク・エンドの法則と持続時間の無視に関するメタ分析（174の独立サンプル）. Organizational Behavior and Human Decision Processes."]},
{ id:"a9",
  title:{ja:"ミスをした時のリカバリー",en:"Recovering from a mistake",zh:"出错时的补救",vi:"Khắc phục khi mắc lỗi"},
  act:{ja:"①すぐ謝る（言い訳しない）②すぐ直す（作り直し・交換）③すぐ社員・リーダーに報告する ④最後にもう一度おわびとお礼を伝える。対応はスピードが最優先。",
       en:"1) Apologize immediately (no excuses) 2) Fix it immediately (remake/replace) 3) Report to a manager or leader right away 4) Apologize and thank them again at the end. Speed comes first.",
       zh:"①马上道歉（不找借口）②马上补救（重做、更换）③马上报告正式员工或领班 ④最后再次道歉并致谢。速度第一。",
       vi:"① Xin lỗi ngay (không biện minh) ② Sửa ngay (làm lại, đổi món) ③ Báo ngay cho quản lý hoặc trưởng ca ④ Cuối cùng xin lỗi và cảm ơn lần nữa. Tốc độ là trên hết."},
  why:{ja:"ミスの後のリカバリーがとても良いと、ミスがなかった時より満足度が高くなることがあります（サービス・リカバリー・パラドックス）。研究をまとめた分析（de Matos ほか 2007）では、満足度への効果は確認されましたが、再来店の意向・口コミ・店のイメージへの効果は確認されませんでした。",
       en:"An excellent recovery can leave guests more satisfied than if nothing had gone wrong (service recovery paradox). A meta-analysis (de Matos et al., 2007) confirmed a positive effect on satisfaction, but no significant effect on repurchase intention, word of mouth or image.",
       zh:"出错后的补救做得非常好时，满意度有时会比没出错时更高（服务补救悖论）。汇总研究的分析（de Matos 等，2007）确认了对满意度的效果，但没有确认对再次光顾意愿、口碑和店铺形象的效果。",
       vi:"Khi khắc phục rất tốt, khách đôi khi hài lòng hơn cả khi không có lỗi (nghịch lý khắc phục dịch vụ). Phân tích tổng hợp (de Matos và cộng sự, 2007) xác nhận hiệu quả với mức hài lòng, nhưng không thấy hiệu quả rõ với ý định quay lại, truyền miệng hay hình ảnh quán."},
  care:{ja:"この逆転が起きるのは、ミスが軽く、対応が非常に良かったときに限られるという研究もあります。リカバリーで取り戻せるのは「満足」までで、「また来たい」まで取り戻せるとは限りません。いちばん大事なのは、ミスを起こさないことです。",
        en:"Some research shows the paradox appears only when the failure is minor and the recovery excellent. Recovery may restore satisfaction, but not necessarily the wish to return. Preventing mistakes matters most.",
        zh:"也有研究表明，只有在错误轻微、补救非常好时才会出现这种反转。补救能挽回的只是“满意”，不一定能挽回“还想再来”。最重要的是不出错。",
        vi:"Có nghiên cứu cho thấy nghịch lý chỉ xảy ra khi lỗi nhẹ và cách khắc phục rất tốt. Khắc phục có thể lấy lại sự hài lòng, nhưng chưa chắc lấy lại được mong muốn quay lại. Quan trọng nhất là không để xảy ra lỗi."},
  src:["de Matos, C. A., Henrique, J. L., & Rossi, C. A. V. (2007). Service recovery paradox: A meta-analysis. Journal of Service Research, 10(1), 60–77."]},
{ id:"a10",
  title:{ja:"「見える化」でお客様もキッチンも満足",en:"Making work visible pleases guests and kitchen",zh:"“可视化”让客人和厨房都满意",vi:"\"Làm cho thấy được\" khiến cả khách và bếp hài lòng"},
  act:{ja:"お客様には「ただいま焼き上げています」と、手間をかけていることを伝える。キッチンには「〇番卓のお客様、とても喜んでいました」と、お客様の反応を伝える。ホールは、お客様と厨房をつなぐ役。",
       en:"Tell guests the care being taken: \"It's being grilled right now.\" Tell the kitchen how guests reacted: \"Table ○ loved it.\" The floor connects guests and kitchen.",
       zh:"告诉客人用心之处：“正在为您现烤”。告诉厨房客人的反应：“〇号桌的客人非常开心”。大厅是连接客人和厨房的角色。",
       vi:"Cho khách biết sự chăm chút: \"Món đang được nướng ạ.\" Báo cho bếp phản ứng của khách: \"Bàn số ○ rất thích ạ.\" Sảnh là cầu nối giữa khách và bếp."},
  why:{ja:"ハーバード大などの実験（Buell, Kim & Tsay 2017）では、食堂で調理人とお客様がお互いを見られるようにすると、料理への満足度が17.3%上がり、提供も13.2%速くなりました。調理人がお客様を見られるだけでも満足度は上がりました。調理人は「自分の仕事が喜ばれている」と感じて、より丁寧に作ったと考えられています。",
       en:"In experiments by Harvard and UCL researchers (Buell, Kim & Tsay, 2017), letting cooks and diners see each other in a cafeteria raised food satisfaction by 17.3% and made service 13.2% faster; even cooks seeing diners alone improved satisfaction. Cooks felt their work was appreciated and cooked with more care.",
       zh:"哈佛大学等的实验（Buell、Kim & Tsay，2017）显示，在食堂让厨师和客人能互相看到时，对菜的满意度提高了17.3%，上菜也快了13.2%；仅让厨师看到客人，满意度也会提高。一般认为厨师感到“自己的工作被欣赏”，做得更用心了。",
       vi:"Trong thí nghiệm của các nhà nghiên cứu Harvard và UCL (Buell, Kim & Tsay, 2017), khi cho đầu bếp và khách nhìn thấy nhau ở căng tin, mức hài lòng với món ăn tăng 17,3% và tốc độ phục vụ nhanh hơn 13,2%; chỉ cần đầu bếp thấy khách cũng đã tăng hài lòng. Đầu bếp cảm thấy công việc được trân trọng nên nấu kỹ hơn."},
  care:{ja:"実験は大学の食堂で、タブレットの映像を使って行われました。店のつくりは変えられなくても、ホールが言葉で「つなぐ」ことはできます。",
        en:"The study was in a university cafeteria using tablet video links. Even if you can't change the layout, the floor can connect both sides with words.",
        zh:"实验是在大学食堂用平板视频进行的。即使改变不了店的格局，大厅也能用语言“连接”双方。",
        vi:"Thí nghiệm làm ở căng tin đại học, dùng video qua máy tính bảng. Dù không đổi được bố trí quán, sảnh vẫn có thể \"kết nối\" bằng lời nói."},
  src:["Buell, R. W., Kim, T., & Tsay, C.-J. (2017). Creating reciprocal value through operational transparency. Management Science, 63(6), 1673–1695."]},
{ id:"a11",
  title:{ja:"効果があっても使わない方法",en:"Methods we don't use, even if they \"work\"",zh:"即使有效也不使用的方法",vi:"Những cách không dùng dù \"có hiệu quả\""},
  act:{ja:"お客様の体にふれる／根拠のない「残りわずか」「人気No.1」／断られた後の何度ものおすすめ／会計を急かして追加注文を迫る。",
       en:"Touching guests / unfounded \"only a few left\" or \"No.1\" / repeated pushing after being declined / pressuring extra orders.",
       zh:"触碰客人身体／没有根据的“所剩无几”“人气第一”／被拒绝后反复推荐／催促并强迫追加点单。",
       vi:"Chạm vào người khách / nói \"sắp hết\" hay \"No.1\" không có căn cứ / mời đi mời lại sau khi bị từ chối / ép gọi thêm món."},
  why:{ja:"アメリカの実験（Crusco & Wetzel 1984）では、手や肩に軽くふれるとチップが増えたという結果があります。しかし日本では、体にふれることは不快感やハラスメントにつながるおそれがあり、店の信用を大きく損ないます。根拠のない表示は景品表示法の問題になりえます。",
       en:"A US experiment (Crusco & Wetzel, 1984) found that a light touch on the hand or shoulder increased tips. In Japan, however, touching can cause discomfort or be seen as harassment and seriously damages the shop's trust. Unfounded claims can be a legal problem under the Act against Misleading Representations.",
       zh:"美国的实验（Crusco & Wetzel，1984）发现轻碰手或肩膀会让小费增加。但在日本，触碰身体可能引起不适或被视为骚扰，会严重损害店的信用。没有根据的表示可能违反景品表示法。",
       vi:"Một thí nghiệm ở Mỹ (Crusco & Wetzel, 1984) cho thấy chạm nhẹ vào tay hoặc vai làm tiền tip tăng. Nhưng ở Nhật, chạm vào người có thể gây khó chịu hoặc bị coi là quấy rối, làm tổn hại nghiêm trọng uy tín của quán. Khẳng định thiếu căn cứ có thể vi phạm luật về quảng cáo sai lệch."},
  care:{ja:"迷ったら「お客様が後でこのやり方を知ったら、うれしいか？」と考える。うれしくないなら使わない。",
        en:"When in doubt, ask: \"If the guest later learned how I did this, would they be happy?\" If not, don't use it.",
        zh:"拿不准时就想：“如果客人之后知道了我用的方法，会高兴吗？”不会高兴就不用。",
        vi:"Khi phân vân, hãy tự hỏi: \"Nếu sau này khách biết mình đã làm thế nào, họ có vui không?\" Nếu không thì đừng dùng."},
  src:["Crusco, A. H., & Wetzel, C. G. (1984). The Midas touch: The effects of interpersonal touch on restaurant tipping. Personality and Social Psychology Bulletin, 10(4), 512–517."]}
];

/* ===================== QRコード生成（バイトモード・誤り訂正M、外部ライブラリなし） ===================== */
const QR = (()=>{
  const ECC = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const NB  = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const rawMods = v => { let r=(16*v+128)*v+64; if(v>=2){ const n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if(v>=7) r-=36; } return r; };
  const dataCW = v => Math.floor(rawMods(v)/8) - ECC[v]*NB[v];
  const mul = (x,y) => { let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z; };
  function rsDiv(deg){ const r=new Array(deg).fill(0); r[deg-1]=1; let root=1;
    for(let i=0;i<deg;i++){ for(let j=0;j<r.length;j++){ r[j]=mul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; } root=mul(root,2); } return r; }
  function rsRem(data,div){ const r=div.map(()=>0); for(const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>r[i]^=mul(c,f)); } return r; }
  function alignPos(v,size){ if(v===1) return []; const n=Math.floor(v/7)+2; const step=(v===32)?26:Math.ceil((v*4+4)/(n*2-2))*2; const r=[6]; for(let p=size-7;r.length<n;p-=step) r.splice(1,0,p); return r; }

  function encode(text){
    const bytes=[...new TextEncoder().encode(text)];
    let v=1; for(;v<=40;v++){ const cc=v<=9?8:16; if(4+cc+bytes.length*8 <= dataCW(v)*8) break; }
    if(v>40) throw new Error("too long");
    const cap=dataCW(v)*8, bits=[];
    const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length, v<=9?8:16); bytes.forEach(b=>put(b,8));
    put(0, Math.min(4, cap-bits.length)); while(bits.length%8) bits.push(0);
    for(let p=0xEC; bits.length<cap; p^=0xEC^0x11) put(p,8);
    const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }
    // 誤り訂正とインターリーブ
    const nb=NB[v], el=ECC[v], raw=Math.floor(rawMods(v)/8), nShort=nb-raw%nb, sLen=Math.floor(raw/nb), div=rsDiv(el), blocks=[];
    for(let i=0,k=0;i<nb;i++){ const len=sLen-el+(i<nShort?0:1); const d=data.slice(k,k+len); k+=len; const e=rsRem(d,div); if(i<nShort) d.push(0); blocks.push(d.concat(e)); }
    const cw=[]; for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==sLen-el || j>=nShort) cw.push(b[i]); });
    // 盤面
    const size=v*4+17, mod=[...Array(size)].map(()=>Array(size).fill(false)), fn=[...Array(size)].map(()=>Array(size).fill(false));
    const setF=(x,y,d)=>{ mod[y][x]=d; fn[y][x]=true; };
    for(let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const x=cx+dx,y=cy+dy; if(x<0||y<0||x>=size||y>=size) continue; const d=Math.max(Math.abs(dx),Math.abs(dy)); setF(x,y,d!==2&&d!==4); } };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    const ap=alignPos(v,size), na=ap.length;
    for(let i=0;i<na;i++) for(let j=0;j<na;j++){ if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)) continue;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) setF(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); }
    const drawFormat=(mask)=>{ const d=(0<<3)|mask; let r=d; for(let i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537); const b=((d<<10)|r)^0x5412; const g=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++) setF(8,i,g(i)); setF(8,7,g(6)); setF(8,8,g(7)); setF(7,8,g(8)); for(let i=9;i<15;i++) setF(14-i,8,g(i));
      for(let i=0;i<8;i++) setF(size-1-i,8,g(i)); for(let i=8;i<15;i++) setF(8,size-15+i,g(i)); setF(8,size-8,true); };
    drawFormat(0);
    if(v>=7){ let r=v; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); const b=(v<<12)|r;
      for(let i=0;i<18;i++){ const bit=((b>>>i)&1)===1, a=size-11+i%3, c=Math.floor(i/3); setF(a,c,bit); setF(c,a,bit); } }
    let i=0;
    for(let right=size-1;right>=1;right-=2){ if(right===6) right=5;
      for(let vert=0;vert<size;vert++) for(let j=0;j<2;j++){ const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
        if(!fn[y][x] && i<cw.length*8){ mod[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1; i++; } } }
    const M=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{ for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!fn[y][x] && M[m](x,y)) mod[y][x]=!mod[y][x]; };
    const penalty=()=>{ let p=0;
      for(let k=0;k<2;k++) for(let a=0;a<size;a++){ let run=1; for(let b=1;b<size;b++){ const c=k?mod[b][a]:mod[a][b], pr=k?mod[b-1][a]:mod[a][b-1]; if(c===pr){ run++; if(run===5) p+=3; else if(run>5) p++; } else run=1; } }
      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=mod[y][x]; if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1]) p+=3; }
      let dark=0; mod.forEach(r=>r.forEach(c=>{ if(c) dark++; })); p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10; return p; };
    let best=0, bestP=Infinity;
    for(let m=0;m<8;m++){ applyMask(m); drawFormat(m); const p=penalty(); if(p<bestP){ bestP=p; best=m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return mod;
  }
  function svg(text, px){
    const m=encode(text), n=m.length, q=4, s=n+q*2; let d="";
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(m[y][x]) d+=`M${x+q},${y+q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${px||200}" height="${px||200}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return {encode, svg};
})();

/* ---------- 共通 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2,10);
const INFRAME = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const STANDALONE = (()=>{ try{ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }catch(e){ return false; } })();

let lang = "ja";
const L = o => o==null ? "" : (typeof o==="string" ? o : (o[lang] ?? o.ja ?? ""));
const T = (k, vars) => { let s = (UI[k]||[k])[LIDX[lang]] ?? UI[k][0]; if(vars) for(const v in vars) s = s.replaceAll("{"+v+"}", vars[v]); return s; };

/* ---------- 日付 ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s,n) => { const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const WDJ = ["日","月","火","水","木","金","土"];
const WD = {ja:WDJ, en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], zh:["日","一","二","三","四","五","六"], vi:["CN","T2","T3","T4","T5","T6","T7"]};
const md = (s, jp) => { const d=new Date(s+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}(${(jp?WDJ:WD[lang])[d.getDay()]})`; };
const monday = s => { const d=new Date(s+"T00:00:00"); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); };
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);

/* ---------- 保存 ---------- */
const KEY = "hallTR.v1";
function newStaff(name){
  return {id:uid(), name:name||"", trainer:"", trainerMail:"", start:today(), periodDays:56,
    mandala:{goal:null, themes:TEMPLATE.themes.map(()=>({title:null, actions:[null,null]})), focus:[3,2]},
    logs:{}, notes:[], weekly:{}, read:{}, readAdv:{}, quiz:{best:null,last:null}, steps:{}, practiced:{}};
}
function blankDB(){ return {v:1, lang:"ja", pin:"", prodEdits:{}, prodAdded:[], prodHidden:[], staff:[newStaff("")], cur:null}; }
function loadDB(){ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){} return null; }
let db = loadDB() || blankDB();
if(!db.cur || !db.staff.find(s=>s.id===db.cur)) db.cur = db.staff[0].id;
lang = db.lang || "ja";
let saveTimer;
function save(flash){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
  if(flash){ const m=$("#toast"); m.textContent=T("saved"); m.classList.add("on"); clearTimeout(saveTimer); saveTimer=setTimeout(()=>m.classList.remove("on"),1100); }
}
const S = () => db.staff.find(s=>s.id===db.cur) || db.staff[0];

  dates.forEach(d=>{ const lg=st.logs[d]; if(!lg||!lg.checks) return;
    st.mandala.themes.forEach((t,ti)=>{ if(themeIdx!=null && ti!==themeIdx) return;
      t.actions.forEach((a,ai)=>{ const v=lg.checks[`${ti}-${ai}`]; if(v in VAL){ sum+=VAL[v]; n++; } }); }); });
  return n ? sum/n : null;
}
const lastDays = (n, end=today()) => Array.from({length:n},(_,i)=>addDays(end,-i));
const dayRate = (st,d,ti) => tally(st,[d],ti);
const rangeRate = (st,n,ti,end) => tally(st,lastDays(n,end),ti);
const col = r => r==null ? "var(--none)" : r>=.8 ? "var(--ok)" : r>=.5 ? "var(--mid)" : "var(--ng)";
const pct = r => r==null ? "-" : Math.round(r*100)+"%";
const recordedDays = st => Object.keys(st.logs).filter(d=>Object.keys(st.logs[d].checks||{}).length).length;
const sumField = (st,f,dates) => (dates||Object.keys(st.logs)).reduce((a,d)=>a+(+(st.logs[d]?.[f])||0),0);

/* ---------- 研修期間とステップ判定 ---------- */
const FR = [0, .125, .375, .75, 1];
const totalDays = st => Math.max(7, +st.periodDays || 56);
function stepRange(st,i){ const t=totalDays(st); const a=Math.floor(FR[i]*t); const b=Math.max(a+1, Math.floor(FR[i+1]*t)); return [addDays(st.start||today(),a), addDays(st.start||today(),b-1)]; }
function expectedStep(st){ const d=daysBetween(st.start||today(), today()); const t=totalDays(st); if(d>=t) return STEPS.length; for(let i=0;i<4;i++){ if(d < Math.max(Math.floor(FR[i]*t)+1, Math.floor(FR[i+1]*t))) return i; } return 3; }
const PARAM = {
  days7: st => Math.max(3, Math.min(7, Math.round(totalDays(st)*.25))),
  suggest30: st => Math.max(5, Math.round(30*totalDays(st)/56)),
  success3: st => Math.max(2, Math.round(10*totalDays(st)/56))
};
const itemText = (st,it) => { const tt = (it.auto==="rate80x2" && totalDays(st)<28 && it.t2) ? it.t2 : it.t; let s=L(tt); if(PARAM[it.auto]) s=s.replaceAll("{n}", PARAM[it.auto](st)); return s; };
const itemTextJa = (st,it) => { const tt = (it.auto==="rate80x2" && totalDays(st)<28 && it.t2) ? it.t2 : it.t; let s=tt.ja; if(PARAM[it.auto]) s=s.replaceAll("{n}", PARAM[it.auto](st)); return s; };
const AUTO = {
  mindAll: st => MIND.every(m=>st.read[m.id]),
  quiz80: st => (st.quiz.best||0) >= 80,
  days7: st => recordedDays(st) >= PARAM.days7(st),
  rate70: st => (rangeRate(st,7)||0) >= .7,
  suggest30: st => sumField(st,"sug") >= PARAM.suggest30(st),
  success3: st => sumField(st,"suc") >= PARAM.success3(st),
  rate80x2: st => (rangeRate(st,7)||0) >= .8 && (totalDays(st)<28 || (rangeRate(st,7,null,addDays(today(),-7))||0) >= .8)
};
const rangeTxt = (st,i,jp) => { const [a,b]=stepRange(st,i); return `${md(a,jp)}〜${md(b,jp)}`; };
function schedStatus(st){ const e=expectedStep(st), c=curStepIdx(st);
  if(c>e) return {k:"ahead", txt:T("schedAhead"), cls:"ok"};
  if(c<e && e<STEPS.length) return {k:"behind", txt:T("schedBehind",{s:L(STEPS[e].name)}), cls:"ng"};
  if(c<e) return {k:"over", txt:T("periodOver"), cls:"ng"};
  return {k:"on", txt:T("schedOn"), cls:"ok"}; }
function periodPicker(cur){
  const opts=[14,28,42,56,84];
  const isCustom = !opts.includes(+cur);
  return `<select id="perSel">${opts.map(d=>`<option value="${d}" ${+cur===d?"selected":""}>${T("weeksN",{n:d/7})}</option>`).join("")}<option value="c" ${isCustom?"selected":""}>${T("customDays")}</option></select>
    <input type="number" id="perDays" min="7" max="365" value="${esc(cur)}" class="${isCustom?"":"hidden"}" style="margin-top:6px" placeholder="${T("daysN",{n:"60"})}">`;
}
function bindPeriod(root){ const s=root.querySelector("#perSel"), d=root.querySelector("#perDays"); if(!s) return; s.onchange=()=>{ if(s.value==="c"){ d.classList.remove("hidden"); d.focus(); } else { d.classList.add("hidden"); d.value=s.value; } }; }
const readPeriod = root => { const s=root.querySelector("#perSel"), d=root.querySelector("#perDays"); const v = s.value==="c" ? +d.value : +s.value; return Math.min(365, Math.max(7, v||56)); };
const itemDone = (st,it) => (it.auto && AUTO[it.auto](st)) || !!st.steps[it.id]?.tr;
const stepDone = (st,sp) => sp.items.every(it=>itemDone(st,it));
const curStepIdx = st => { const i=STEPS.findIndex(sp=>!stepDone(st,sp)); return i<0 ? STEPS.length : i; };

function dlg(html, buttons, opt={}){
  return new Promise(res=>{
    const m=$("#modal"), sh=$("#sheet");
    sh.innerHTML = html + `<div class="row end">${buttons.map((b,i)=>`<button class="btn ${b.cls||"line"}" data-i="${i}">${b.label}</button>`).join("")}</div>`;
    m.classList.remove("hidden"); m.dataset.lock = opt.lock ? "1" : "";
    m._res = v=>{ m.classList.add("hidden"); res(v); };
    sh.querySelectorAll(".row.end button[data-i]").forEach(bt=>bt.onclick=()=>{
      const b=buttons[+bt.dataset.i]; const v = typeof b.v==="function" ? b.v(sh) : b.v;

    });
    const f=sh.querySelector("input,textarea"); if(f && !opt.noFocus) setTimeout(()=>f.focus(),60);
  });
}

function copyText(txt){
  let ok=false;
  try{ if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>flash(T("copied"))).catch(()=>fallback()); ok=true; } }catch(e){}
  if(!ok) fallback();
  function fallback(){ try{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); flash(T("copied")); }catch(e){} }
}

/* ===================== 報告 ===================== */
let repPeriod = "week";
function periodDates(){
  const t0=today();
  if(repPeriod==="today") return [t0];
  if(repPeriod==="week"){ const m=monday(t0); return Array.from({length:daysBetween(m,t0)+1},(_,i)=>addDays(m,i)); }
  if(repPeriod==="lastweek"){ const m=addDays(monday(t0),-7); return Array.from({length:7},(_,i)=>addDays(m,i)); }
  return Array.from({length:14},(_,i)=>addDays(t0,i-13));
}
function buildReport(){
  const st=S(), ds=periodDates(), t0=today();
  const rec=ds.filter(d=>Object.keys(st.logs[d]?.checks||{}).length);
  const r=tally(st,ds); const sug=sumField(st,"sug",ds), suc=sumField(st,"suc",ds);
  const si=curStepIdx(st); const sp=STEPS[si];
  const L2 = o => typeof o==="string" ? o : o.ja;
  const lines=[];
  lines.push(`【ホール研修 報告】`);
  lines.push(`名前：${st.name}`);
  if(st.trainer) lines.push(`研修担当：${st.trainer} 様`);
  const tot=totalDays(st), dn=Math.max(1,daysBetween(st.start||t0,t0)+1);
  lines.push(`報告期間：${md(ds[0],1)}〜${md(ds[ds.length-1],1)}`);
  lines.push(`研修期間：${st.start?md(st.start,1):""}から${tot}日間（${Math.min(dn,tot)}日目／残り${Math.max(0,tot-dn+1)}日）`);
  { const e=expectedStep(st), c=curStepIdx(st); lines.push(`進み具合：${c>e?"予定より早い":c<e?(e<STEPS.length?`予定より遅れ（目安は${STEPS[e].name.ja}）`:"研修期間を超過"):"予定どおり"}`); }
  lines.push(`現在のステップ：${sp?L2(sp.name)+`（${sp.items.filter(it=>itemDone(st,it)).length}/${sp.items.length}）`:"全ステップ修了"}`);
  lines.push("");
  lines.push(`■ 行動チェック`);
  lines.push(`記録日数：${rec.length}日／達成度：${pct(r)}`);
  const per = st.mandala.themes.map((_,ti)=>({t:mTitleJa(st,ti), r:tally(st,ds,ti)})).filter(x=>x.r!=null);
  if(per.length){ per.sort((a,b)=>b.r-a.r);
    const good=per.filter(x=>x.r>=.8).slice(0,2), bad=per.filter(x=>x.r<.8).slice(-2).reverse();
    lines.push(`よくできた：${good.length?good.map(x=>`${x.t} ${pct(x.r)}`).join("、"):"なし（80%以上の要素なし）"}`);
    if(bad.length) lines.push(`課題：${bad.map(x=>`${x.t} ${pct(x.r)}`).join("、")}`); }
  lines.push(`提案：${sug}回（注文につながった ${suc}回${sug?`／成功率 ${Math.round(suc/sug*100)}%`:""}）`);
  lines.push(`確認テスト最高点：${st.quiz.best!=null?st.quiz.best+"点":"未受験"}／マインド読了：${MIND.filter(m=>st.read[m.id]).length}/${MIND.length}／上級編読了：${ADV.filter(m=>(st.readAdv||{})[m.id]).length}/${ADV.length}`);
  const wk=st.weekly[monday(ds[ds.length-1])];
  if(wk && (wk.scores?.some(x=>x)||wk.learn||wk.next||wk.ask)){
    lines.push(""); lines.push("■ 週の自己振り返り");
    const sc=st.mandala.themes.map((_,ti)=>wk.scores?.[ti]?`${mTitleJa(st,ti)} ${wk.scores[ti]}`:null).filter(Boolean);
    if(sc.length) lines.push(`自己評価（5点満点）：${sc.join("、")}`);
    if(wk.learn) lines.push(`できるようになったこと：${wk.learn}`);
    if(wk.next) lines.push(`来週の重点：${wk.next}`);
    if(wk.ask) lines.push(`相談したいこと：${wk.ask}`);
  }
  const refl=ds.filter(d=>{const l=st.logs[d];return l&&(l.good||l.bad||l.next);});
  if(refl.length){ lines.push(""); lines.push("■ 日々の振り返り");
    refl.forEach(d=>{ const l=st.logs[d]; lines.push(`${md(d,1)}`);
      if(l.good) lines.push(`・良かった：${l.good}`); if(l.bad) lines.push(`・できなかった：${l.bad}`); if(l.next) lines.push(`・次に意識：${l.next}`); }); }
  const nts=st.notes.filter(n=>ds.includes(n.date));
  if(nts.length){ lines.push(""); lines.push("■ 気づきメモ");
    nts.forEach(n=>lines.push(`・[${NOTE_CATS.find(c=>c.id===n.cat)?.ja||""}] ${n.text}`)); }
  return lines.join("\n");
}

  const st=S(); const txt=buildReport();

  const mail=`mailto:${encodeURIComponent(st.trainerMail||"")}?subject=${encodeURIComponent(`ホール研修 報告（${st.name}）`)}&body=${encodeURIComponent(txt)}`;
  return `<div class="card"><h2>${T("repTitle")}</h2>

    if(st.readAdv[id]){ const i=ADV.findIndex(m=>m.id===id); openAdv = ADV[i+1]?.id || null; } render(); });
  // 商品
  v.querySelectorAll("[data-pcat]").forEach(b=>b.onclick=()=>{ prodCat=b.dataset.pcat; render(); });
  v.querySelectorAll("[data-prac]").forEach(c=>c.onchange=()=>{ st.practiced[c.dataset.prac]=c.checked; save(true); });
  // ステップ
  v.querySelectorAll("[data-sself]").forEach(b=>b.onclick=()=>{ const id=b.dataset.sself; st.steps[id]={...(st.steps[id]||{}), self:!st.steps[id]?.self}; save(true); render(); });
  v.querySelectorAll("[data-str]").forEach(b=>b.onclick=async()=>{ if(!await needPin()) return; const id=b.dataset.str; st.steps[id]={...(st.steps[id]||{}), tr:!st.steps[id]?.tr}; save(true); render(); });
  // テスト
  const qs=$("#qStart"), qr=$("#qRetry"), qn=$("#qNext");
  if(qs) qs.onclick=()=>{ quizState={i:0,ok:0,ans:null}; render(); };
  if(qr) qr.onclick=()=>{ quizState={i:0,ok:0,ans:null}; render(); };
  v.querySelectorAll("[data-qa]").forEach(b=>b.onclick=()=>{ const a=+b.dataset.qa; quizState.ans=a; if(a===QUIZ[quizState.i].a) quizState.ok++; render(); });
  if(qn) qn.onclick=()=>{ quizState.i++; quizState.ans=null;
    if(quizState.i>=QUIZ.length){ const sc=Math.round(quizState.ok/QUIZ.length*100); st.quiz.last=sc; st.quiz.best=Math.max(st.quiz.best||0,sc); st.quiz.date=today(); save(); } render(); };
  // チェック
  const di=$("#dateIn"); if(di) di.onchange=()=>{ curDate=di.value||today(); render(); };
  const tt=$("#toToday"); if(tt) tt.onclick=()=>{ curDate=today(); render(); };
  v.querySelectorAll(".tri button").forEach(b=>b.onclick=()=>{ const k=b.parentElement.dataset.k, lg=getLog();
    if(lg.checks[k]===b.dataset.v) delete lg.checks[k]; else lg.checks[k]=b.dataset.v; save(); render(); });
  v.querySelectorAll("[data-cnt]").forEach(b=>b.onclick=()=>{ const [f,n]=b.dataset.cnt.split(":"); const lg=getLog(); lg[f]=Math.max(0,(+lg[f]||0)+(+n)); if(f==="sug"&&lg.suc>lg.sug) lg.suc=lg.sug; if(f==="suc"&&lg.suc>lg.sug) lg.sug=lg.suc; save(); render(); });
  v.querySelectorAll("[data-lf]").forEach(t=>t.oninput=()=>{ getLog()[t.dataset.lf]=t.value; save(); });
  v.querySelectorAll("[data-lf]").forEach(t=>t.onblur=()=>flash(T("saved")));
  const qnBtn=$("#quickNote"); if(qnBtn) qnBtn.onclick=()=>quickNote();
  // マンダラ
  v.querySelectorAll("[data-mg]").forEach(c=>c.onclick=()=>editGoal());
  v.querySelectorAll("[data-mt]").forEach(c=>c.onclick=()=>editTheme(+c.dataset.mt));
  // 週
  const ws=$("#weekSel"); if(ws) ws.onchange=()=>{ weekSel=ws.value; render(); };
  const wk=()=>{ const k=weekSel||monday(today()); if(!st.weekly[k]) st.weekly[k]={scores:[],learn:"",next:"",ask:""}; return st.weekly[k]; };
  v.querySelectorAll("[data-ws]").forEach(b=>b.onclick=()=>{ const [ti,n]=b.dataset.ws.split(":").map(Number); const w=wk(); w.scores[ti]= w.scores[ti]===n?0:n; save(true); render(); });
  v.querySelectorAll("[data-wf]").forEach(t=>t.oninput=()=>{ wk()[t.dataset.wf]=t.value; save(); });
  // メモ
  const na=$("#nAdd"); if(na) na.onclick=()=>{ const t=$("#nText").value.trim(); if(!t) return; st.notes.push({id:uid(),date:today(),t:Date.now(),cat:$("#nCat").value,text:t}); save(true); render(); };
  v.querySelectorAll("[data-nf]").forEach(b=>b.onclick=()=>{ noteFilter=b.dataset.nf; render(); });
  v.querySelectorAll("[data-ndel]").forEach(b=>b.onclick=async()=>{ if(!await askYes(T("del")+"?")) return; st.notes=st.notes.filter(n=>n.id!==b.dataset.ndel); save(); render(); });
  // 記録
  v.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ curDate=b.dataset.day; go("check"); });
  // 報告
  v.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{ repPeriod=b.dataset.rp; render(); });
  const rc=$("#repCopy"); if(rc) rc.onclick=()=>copyText(buildReport());
  // 設定
  v.querySelectorAll("[data-pf]").forEach(i=>i.onchange=()=>{ const f=i.dataset.pf; if(f==="name" && !i.value.trim()){ i.value=st.name; note(T("needName")); return; } st[f]=i.value.trim(); save(true); renderHeader(); });
  v.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; db.lang=lang; save(); render(); });
  const pb=$("#perBox"); if(pb){ bindPeriod(pb); const upd=()=>{ const v2=readPeriod(pb); if(v2!==totalDays(st)){ st.periodDays=v2; save(true); } };
    pb.querySelector("#perSel").addEventListener("change",()=>{ if(pb.querySelector("#perSel").value!=="c") upd(); });
    pb.querySelector("#perDays").addEventListener("change",upd); }
  v.querySelectorAll("[data-pe]").forEach(b=>b.onclick=async()=>{ if(!await needPin()) return; editProduct(b.dataset.pe); });
  v.querySelectorAll("[data-ph]").forEach(b=>b.onclick=async()=>{ if(!await needPin()) return; const id=b.dataset.ph; db.prodHidden = db.prodHidden.includes(id) ? db.prodHidden.filter(x=>x!==id) : db.prodHidden.concat(id); save(true); render(); });
  const pa=$("#pAdd"); if(pa) pa.onclick=async()=>{ if(!await needPin()) return; editProduct(null); };
  const pr=$("#pReset"); if(pr) pr.onclick=async()=>{ if(!await needPin()) return; if(!await askYes(T("resetAsk"))) return; db.prodEdits={}; db.prodAdded=[]; db.prodHidden=[]; save(true); render(); };
  const ps=$("#pinSet"); if(ps) ps.onclick=async()=>{ if(!await needPin()) return; const v2=await dlg(`<h3>${T("pin")}</h3><p class="muted" style="font-size:12px">${T("pinHelp")}</p><input type="password" inputmode="numeric" id="np" autocomplete="off">`,[{label:T("cancel"),v:null},{label:T("save"),v:sh=>sh.querySelector("#np").value.trim(),cls:"main"}]); if(v2===null) return; db.pin=v2; save(true); render(); };
  const sp2=$("#stPick"); if(sp2) sp2.onclick=()=>staffPicker();
  const sa=$("#stAdd"); if(sa) sa.onclick=()=>{ const s=newStaff(""); db.staff.push(s); db.cur=s.id; save(); render(); onboarding(); };
  const sd=$("#stDel"); if(sd) sd.onclick=async()=>{ if(db.staff.length<=1){ note(T("lastOne")); return; } if(!await needPin()) return; if(!await askYes(T("delAsk",{n:esc(st.name)}))) return; db.staff=db.staff.filter(s=>s.id!==db.cur); db.cur=db.staff[0].id; save(); render(); };
  const mr=$("#mReset"); if(mr) mr.onclick=async()=>{ if(!await askYes(T("resetAsk"))) return; const n=newStaff(""); st.mandala=n.mandala; save(true); render(); };
  const ex=$("#exp"); if(ex) ex.onclick=()=>exportData();
  const uc=$("#urlCopy"); if(uc) uc.onclick=()=>copyText(appUrl());
  const ue=$("#urlEdit"); if(ue) ue.onclick=async()=>{ if(!await needPin()) return;
    const u=await dlg(`<h3>${T("urlEdit")}</h3><input type="text" id="uu" value="${esc(appUrl())}" inputmode="url">`,[{label:T("cancel"),v:null},{label:T("save"),cls:"main",v:sh=>sh.querySelector("#uu").value.trim()}]);
    if(u===null) return; db.appUrl = /^https?:\/\//.test(u) ? u : ""; save(true); render(); };
  const dr=$("#delRec"); if(dr) dr.onclick=async()=>{ if(!await needPin()) return; if(!await askYes(T("delRecAsk",{n:esc(st.name)}))) return;
    Object.assign(st,{logs:{},notes:[],weekly:{},read:{},readAdv:{},quiz:{best:null,last:null},steps:{},practiced:{}}); save(); render(); flash(T("deleted")); };
  const da=$("#delAllBtn"); if(da) da.onclick=async()=>{ if(!await needPin()) return;
    const t=await dlg(`<div class="pmsg">${T("delAllAsk")}</div><input type="text" id="dc" autocomplete="off">`,[{label:T("cancel"),v:null},{label:T("del"),cls:"danger",v:sh=>sh.querySelector("#dc").value.trim()}]);
    if(t!=="削除") return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    db=blankDB(); db.cur=db.staff[0].id; db.installAsked=true; lang="ja"; quizState=null; page="home"; render(); flash(T("deleted")); onboarding(); };
  const ifl=$("#impFile"); if(ifl) ifl.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>importText(rd.result); rd.readAsText(f); };
  const ip=$("#impPaste"); if(ip) ip.onclick=async()=>{ const t=await dlg(`<h3>${T("importPaste")}</h3><textarea id="pt" rows="8"></textarea>`,[{label:T("cancel"),v:null},{label:T("importPaste"),v:sh=>sh.querySelector("#pt").value,cls:"main"}]); if(t) importText(t); };
}

async function quickNote(){
  const st=S();
  const v=await dlg(`<h3>${T("addNote")}</h3><select id="qc">${NOTE_CATS.map(c=>`<option value="${c.id}">${esc(L(c))}</option>`).join("")}</select><textarea id="qt" rows="4" placeholder="${T("noteText")}"></textarea>`,
    [{label:T("cancel"),v:null},{label:T("add"),cls:"main",v:sh=>({cat:sh.querySelector("#qc").value,text:sh.querySelector("#qt").value.trim()})}]);
  if(v && v.text){ st.notes.push({id:uid(),date:curDate,t:Date.now(),cat:v.cat,text:v.text}); save(true); }
}
async function editGoal(){
  const st=S();
  const v=await dlg(`<h3>${T("editGoal")}</h3><input type="text" id="g" value="${esc(mGoal(st))}">`,[{label:T("cancel"),v:null},{label:T("save"),cls:"main",v:sh=>sh.querySelector("#g").value.trim()}]);
  if(v){ if(v!==mGoal(st)) st.mandala.goal=v; save(true); render(); }
}
async function editTheme(ti){
  const st=S(), m=st.mandala, isF=(m.focus||[]).includes(ti);
  const acts=[0,1,2].map(j=>j<nActs(st,ti)?mAct(st,ti,j):"");
  const v=await dlg(`<h3>${T("element")}${ti+1}</h3>
    <label class="f">${T("elemName")}</label><input type="text" id="et" value="${esc(mTitle(st,ti))}">
    <label class="f">${T("actionsLbl")}</label>${acts.map((a,j)=>`<input type="text" id="ea${j}" value="${esc(a)}" placeholder="${T("action")}${j+1}">`).join("")}
    <label class="chk"><input type="checkbox" id="ef" ${isF?"checked":""}> ${T("makeFocus")}</label>`,
    [{label:T("cancel"),v:null},{label:T("save"),cls:"main",v:sh=>({t:sh.querySelector("#et").value.trim(),a:[0,1,2].map(j=>sh.querySelector("#ea"+j).value.trim()),f:sh.querySelector("#ef").checked})}]);
  if(!v) return;
  const th=m.themes[ti];
  if(v.t && v.t!==mTitle(st,ti)) th.title=v.t;
  const newActs=v.a.map((a,j)=> (j<nActs(st,ti) && a===mAct(st,ti,j)) ? th.actions[j] : a);
  while(newActs.length>1 && !newActs[newActs.length-1]) newActs.pop();
  th.actions=newActs;
  let f=(m.focus||[]).filter(x=>x!==ti); if(v.f){ f.unshift(ti); f=f.slice(0,2); } m.focus=f;
  save(true); render();
}
async function editProduct(id){
  const p = id ? productJa(id) : {cat:"",name:"",feature:"",talk:"",timing:"",pair:"",caution:""};
  const F=[["cat","category"],["name","prodName"],["feature","feature"],["talk","talk"],["timing","timing"],["pair","pair"],["caution","caution"]];
  const v=await dlg(`<h3>${id?T("edit"):T("addProd")}</h3>${F.map(([f,k])=>`<label class="f">${T(k)}</label>${f==="cat"||f==="name"?`<input type="text" id="pf_${f}" value="${esc(p[f]||"")}">`:`<textarea id="pf_${f}" rows="${f==="talk"?3:2}">${esc(p[f]||"")}</textarea>`}`).join("")}
    ${id && db.prodAdded.find(x=>x.id===id)?`<button class="btn danger sm" id="pfDel" style="margin-top:10px">${T("del")}</button>`:""}`,
    [{label:T("cancel"),v:null},{label:T("save"),cls:"main",v:sh=>{ const o={}; F.forEach(([f])=>o[f]=sh.querySelector("#pf_"+f).value.trim()); return o.name?o:undefined; }}]);
  if(v==="del"){ db.prodAdded=db.prodAdded.filter(x=>x.id!==id); save(true); render(); return; }
  if(!v) return;
  if(!id) db.prodAdded.push({id:"c"+uid(),...v});
  else if(db.prodAdded.find(x=>x.id===id)) Object.assign(db.prodAdded.find(x=>x.id===id), v);
  else db.prodEdits[id]=v;
  save(true); render();
}
document.addEventListener("click", e=>{ if(e.target.id==="pfDel"){ $("#modal")._res("del"); } });

function exportData(){
  const txt=JSON.stringify(db);
  if(!INFRAME){ try{ const b=new Blob([txt],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`hallTR_${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} }
  dlg(`<h3>${T("exportBtn")}</h3><p class="muted" style="font-size:12px">${T("backupNote")}</p><textarea rows="7" readonly>${esc(txt)}</textarea>`,
    [{label:T("close"),v:0},{label:T("copy"),v:1,cls:"main"}]).then(v=>{ if(v) copyText(txt); });
}
async function importText(t){
  try{ const d=JSON.parse(t); if(!d.staff||!Array.isArray(d.staff)) throw 0;
    if(!await askYes(T("replaceAsk"))) return; db=d; lang=db.lang||"ja"; save(); render(); note(T("importOk")); }
  catch(_){ note(T("importNg")); }
}

/* ---------- 最初のホーム画面追加案内 ---------- */
const UA = navigator.userAgent||"";
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints>1);
const IS_AND = /Android/.test(UA);
async function installGate(){
  const steps = IS_IOS ? [INSTALL[0]] : IS_AND ? [INSTALL[1]] : [INSTALL[0],INSTALL[1]];
  const v = await dlg(`<div class="fi"><div class="logo">TR</div><h3>${T("fiTitle")}</h3>
    <p class="pmsg">${T("fiWhy")}</p>
    ${steps.map(s=>`<div class="fistep"><b>${esc(L(s.h))}</b><p>${nl(L(s.p))}</p></div>`).join("")}</div>`,
    [{label:T("fiLater"),v:"later"},{label:T("fiAdded"),v:"added",cls:"main"}], {lock:true, noFocus:true});
  if(v==="added"){
    const b = await dlg(`<div class="fi"><div class="logo">TR</div><p class="pmsg">${T("fiReopen")}</p></div>`,
      [{label:T("fiBack"),v:"back"},{label:T("fiLater"),v:"later",cls:"main"}], {lock:true, noFocus:true});
    if(b==="back") return installGate();
  }
  db.installAsked = true; save();
  onboarding();
}

/* ---------- 起動 ---------- */
render();
if(!S().name){ if(!STANDALONE && !db.installAsked) installGate(); else onboarding(); }
if(!INFRAME && "serviceWorker" in navigator && location.protocol==="https:"){
  try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
}


</script>
